name: Release Build CI

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - ".github/**"
      - "Readme.md"
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - ".github/**"
      - "Readme.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        type: string
      # Names must be build_<matrix.id>_<matrix.build-type>: the build job looks
      # them up dynamically instead of enumerating every combination.
      build_Android-arm64-v8a_Release:
        description: "Build Android arm64-v8a Release"
        default: true
        type: boolean
      build_Android-arm64-v8a_Debug:
        description: "Build Android arm64-v8a Debug"
        default: true
        type: boolean
      build_Android-armeabi-v7a_Release:
        description: "Build Android armeabi-v7a Release"
        default: true
        type: boolean
      build_Android-armeabi-v7a_Debug:
        description: "Build Android armeabi-v7a Debug"
        default: true
        type: boolean
      build_iOS_Release:
        description: "Build iOS Release"
        default: true
        type: boolean
      build_iOS_Debug:
        description: "Build iOS Debug"
        default: true
        type: boolean
      build_OSX_Release:
        description: "Build OSX Release"
        default: true
        type: boolean
      build_OSX_Debug:
        description: "Build OSX Debug"
        default: true
        type: boolean
      build_Linux-x86_64_Release:
        description: "Build Linux x86_64 Release"
        default: true
        type: boolean
      build_Linux-x86_64_Debug:
        description: "Build Linux x86_64 Debug"
        default: true
        type: boolean
      build_Linux-aarch64_Release:
        description: "Build Linux aarch64 Release"
        default: true
        type: boolean
      build_Linux-aarch64_Debug:
        description: "Build Linux aarch64 Debug"
        default: true
        type: boolean
      build_Windows_Release:
        description: "Build Windows Release"
        default: true
        type: boolean
      build_Windows_Debug:
        description: "Build Windows Debug"
        default: true
        type: boolean
permissions:
  contents: write
  packages: read
jobs:
  resolve-runners:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
      CCACHE_MAXSIZE: "50"
    outputs:
      linux_x64: ${{ steps.pick.outputs.linux_x64 }}
      linux_arm: ${{ steps.pick.outputs.linux_arm }}
      windows: ${{ steps.pick.outputs.windows }}
      mac: ${{ steps.pick.outputs.mac }}
    steps:
      - name: Check self-hosted runner availability
        id: pick
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ORG="${REPO%%/*}"

          # Some org-scoped runners do not show up via the repo endpoint for this
          # token, so query both scopes and merge the results.
          fetch() { gh api "$1/actions/runners" --paginate 2>/dev/null || echo '{"runners":[]}'; }
          data="$(jq -n --argjson r "$(fetch "/repos/$REPO")" --argjson o "$(fetch "/orgs/$ORG")" \
            '{runners: (($r.runners // []) + ($o.runners // []) | unique_by(.id))}')"

          {
            echo "## Runner availability"
            echo
            echo "Repository: $REPO | Organization: $ORG"
            echo "Discovered runners (repo+org merged):"
            echo "$data" | jq -r '.runners[]? | "- \(.name) | status=\(.status) | busy=\(.busy) | labels=\([.labels[].name] | join(", "))"'
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # Returns ["self-hosted","<label>"] if at least one matching runner is
          # online and not busy, otherwise the GitHub-hosted fallback ($2).
          # Matches either runner name or label text, case-insensitively.
          pick() {
            if echo "$data" | jq -e --arg L "$1" \
              '.runners[]
               | select(.status=="online" and (.busy|not))
               | select((.name | ascii_downcase) == ($L | ascii_downcase)
                 or any(.labels[]; (.name | ascii_downcase) == ($L | ascii_downcase)))' \
              >/dev/null 2>&1; then
              echo "- $1: self-hosted" >> "$GITHUB_STEP_SUMMARY"
              echo "[\"self-hosted\",\"$1\"]"
            else
              echo "- $1: fallback" >> "$GITHUB_STEP_SUMMARY"
              echo "$2"
            fi
          }

          {
            echo "linux_x64=$(pick sg-ubuntu-linux '["ubuntu-latest"]')"
            echo "linux_arm=$(pick sg-arm-linux    '["ubuntu-24.04-arm"]')"
            echo "windows=$(pick   SG-WIN11        '["windows-2022"]')"
            echo "mac=$(pick       gv-OSX-Large    '["macos-latest"]')"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-runners
    env:
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
      BUILD_DIRECTORY: build/${{ matrix.target }}/${{ matrix.build-type }}${{ matrix.abi && format('/{0}', matrix.abi) || '' }}
      FILE_NAME: ${{ matrix.id }}-${{ matrix.build-type }}.tar.gz
      # zkLLVM only releases Release artifacts (except Windows, which releases both),
      # so non-Windows Debug builds link against the Release zkLLVM.
      ZK_TYPE: ${{ matrix.target == 'Windows' && matrix.build-type || 'Release' }}
      IS_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
      RELEASE: ${{ github.ref_name == 'main' || github.ref_name == 'develop' || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
      RELEASE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag) || format('{0}-{1}-{2}', matrix.id, github.ref_name, matrix.build-type) }}
      RESOLVED_BRANCH: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag) || ((github.event.pull_request.head.ref || github.ref_name) == 'main' && 'main' || 'develop') }}
      RUN_TESTS: ${{ matrix.target == 'Linux' || matrix.target == 'OSX' || (matrix.target == 'Windows' && matrix.build-type == 'Release') }}
    runs-on: ${{ fromJson(needs.resolve-runners.outputs[matrix.runner_key]) }}
    container:
      image: ${{ matrix.container }}
      options: --cap-add=IPC_LOCK
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GNUS_TOKEN_1 }}
    strategy:
      fail-fast: false
      matrix:
        target: [iOS, OSX, Windows]
        build-type: [Debug, Release]
        include:
          - target: iOS
            id: iOS
            runner_key: mac
            cmake_args: -DPLATFORM=OS64
          - target: OSX
            id: OSX
            runner_key: mac
            cmake_args: -DPLATFORM=MAC_UNIVERSAL
          - target: Windows
            id: Windows
            runner_key: windows
          - target: Linux
            id: Linux-x86_64
            abi: x86_64
            build-type: Release
            runner_key: linux_x64
            container: ghcr.io/geniusventures/almalinux-8:latest
            cmake_args: -DSGNS_PRINT_LOGS=ON
          - target: Linux
            id: Linux-x86_64
            abi: x86_64
            build-type: Debug
            runner_key: linux_x64
            container: ghcr.io/geniusventures/almalinux-8:latest
            cmake_args: -DSGNS_PRINT_LOGS=ON
          - target: Linux
            id: Linux-aarch64
            abi: aarch64
            build-type: Release
            runner_key: linux_arm
            container: ghcr.io/geniusventures/almalinux-8:latest
            cmake_args: -DSGNS_PRINT_LOGS=ON
          - target: Linux
            id: Linux-aarch64
            abi: aarch64
            build-type: Debug
            runner_key: linux_arm
            container: ghcr.io/geniusventures/almalinux-8:latest
            cmake_args: -DSGNS_PRINT_LOGS=ON
          - target: Android
            id: Android-arm64-v8a
            abi: arm64-v8a
            build-type: Release
            runner_key: linux_x64
            cmake_args: -DANDROID_ABI=arm64-v8a
          - target: Android
            id: Android-arm64-v8a
            abi: arm64-v8a
            build-type: Debug
            runner_key: linux_x64
            cmake_args: -DANDROID_ABI=arm64-v8a
          - target: Android
            id: Android-armeabi-v7a
            abi: armeabi-v7a
            build-type: Release
            runner_key: linux_x64
            cmake_args: -DANDROID_ABI=armeabi-v7a
          - target: Android
            id: Android-armeabi-v7a
            abi: armeabi-v7a
            build-type: Debug
            runner_key: linux_x64
            cmake_args: -DANDROID_ABI=armeabi-v7a
    steps:
      # Shell-agnostic body so this works on both bash and pwsh runners.
      - name: Skip build disabled by workflow_dispatch input
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs[format('build_{0}_{1}', matrix.id, matrix.build-type)] }}
        run: |
          echo "Skipping build for ${{ matrix.id }} ${{ matrix.build-type }}"
          exit 78

      - name: Configure bash on Windows (use Git Bash, not WSL)
        if: ${{ runner.environment == 'self-hosted' && matrix.target == 'Windows' }}
        run: |
          foreach ($p in @("C:\Program Files\Git\bin", "C:\Program Files\Git\usr\bin")) {
            if (Test-Path $p) {
              Add-Content -Path $env:GITHUB_PATH -Value $p
              $env:PATH = "$p;$env:PATH"
            }
          }
          $bash = (Get-Command bash.exe -ErrorAction SilentlyContinue).Source
          Write-Output $(if ($bash) { "Bash location: $bash" } else { "WARNING: bash.exe not found in PATH" })

      - name: Clean workspace (self-hosted runners)
        if: ${{ runner.environment == 'self-hosted' }}
        working-directory: ${{ runner.workspace }}
        shell: bash
        run: |
          # Container jobs leave root-owned files behind on Linux.
          SUDO=$([ "$(uname)" = Linux ] && echo sudo || echo)
          # Keep the SuperGenius directory itself, drop its contents.
          [ -d SuperGenius ] && $SUDO rm -rf SuperGenius/* SuperGenius/.[!.]* || true
          $SUDO rm -rf thirdparty zkLLVM
          ls -la

      - name: Install git-lfs (Linux containers)
        # The AlmaLinux 8 CI image bakes git-lfs in (via EPEL), so this is a
        # no-op there; the Ubuntu-host Android jobs have it preinstalled as
        # well. actions/checkout's lfs:true hard-fails with "Unable to locate
        # executable file: git-lfs" (run 35136102223) when it is missing, so
        # keep the guarded static-binary drop-in as a safety net for any
        # Linux host that still lacks it. apt is deliberately NOT used:
        # the pinned static binary works identically on amd64 and arm64
        # without depending on distro package state.
        if: ${{ runner.os == 'Linux' }}
        run: |
          if command -v git-lfs >/dev/null 2>&1; then
            echo "git-lfs already present: $(git-lfs version)"
            exit 0
          fi
          arch="$(uname -m)"
          case "$arch" in
            x86_64)  lfs_arch="amd64" ;;
            aarch64) lfs_arch="arm64" ;;
            *) echo "Unsupported architecture for git-lfs download: $arch"; exit 1 ;;
          esac
          # 3.7.1 matches the Windows runner's version; v3.x static tarballs
          # are just the single binary + manpages. curl preferred, wget
          # fallback -- a minimal host is not guaranteed to carry either.
          url="https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-${lfs_arch}-v3.7.1.tar.gz"
          if command -v curl >/dev/null 2>&1; then
            curl -fsSL --retry 3 -o /tmp/git-lfs.tgz "$url"
          elif command -v wget >/dev/null 2>&1; then
            wget -q --tries=3 -O /tmp/git-lfs.tgz "$url"
          else
            echo "ERROR: neither curl nor wget found in container"; exit 1
          fi
          tar -xzf /tmp/git-lfs.tgz -C /tmp
          sudo install -m 0755 /tmp/git-lfs-3.7.1/git-lfs /usr/local/bin/git-lfs
          rm -rf /tmp/git-lfs.tgz /tmp/git-lfs-3.7.1
          git-lfs version

      - name: Checkout SuperGenius repository
        uses: actions/checkout@v7
        with:
          path: "SuperGenius"
          submodules: "recursive"
          # The VALD-02 cross-machine .cap fixtures under
          # SuperGenius/test/src/processing/fixtures/ are tracked via Git LFS
          # (.gitattributes "*.cap filter=lfs"). Without lfs: true the checkout
          # materializes 134-byte pointer files and
          # processing_validation_core_test's DeserializeCaptureFile correctly
          # rejects them on every platform (observed run 35045845230: test #89
          # failed on all six desktop jobs).
          lfs: true
          persist-credentials: true # We need the credentials for uploading the release later

      - name: Download thirdparty release
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          mkdir thirdparty && cd thirdparty
          if [ "$IS_TAG" = true ]; then
            tag="$RESOLVED_BRANCH"
          else
            tag="${{ matrix.id }}-$RESOLVED_BRANCH-${{ matrix.build-type }}"
          fi
          gh release download "$tag" --repo GeniusVentures/thirdparty -p "$FILE_NAME"
          tar -zxf "$FILE_NAME"
          # CMake on Windows needs a native path, not the MSYS one.
          echo "THIRDPARTY_BUILD_DIR=$([ "${{ matrix.target }}" = Windows ] && pwd -W || pwd)/$BUILD_DIRECTORY" >> $GITHUB_ENV

      - name: Download zkLLVM release
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          mkdir zkLLVM && cd zkLLVM
          zk_file="${{ matrix.id }}-$ZK_TYPE.tar.gz"
          zk_dir="build/${{ matrix.target }}/$ZK_TYPE${{ matrix.abi && format('/{0}', matrix.abi) || '' }}"
          if [ "$IS_TAG" = true ]; then
            tag="$RESOLVED_BRANCH"
          else
            tag="${{ matrix.id }}-$RESOLVED_BRANCH-$ZK_TYPE"
          fi
          gh release download "$tag" --repo GeniusVentures/zkLLVM -p "$zk_file"
          tar --exclude='*bin/assigner' --exclude='*bin/clang-zkllvm' --exclude='*bin/llvm-link-zkllvm' --exclude='*bin/transpiler' -xzf "$zk_file"
          echo "ZKLLVM_BUILD_DIR=$([ "${{ matrix.target }}" = Windows ] && pwd -W || pwd)/$zk_dir" >> $GITHUB_ENV

      - name: Configure Linux host
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo update-alternatives --install /usr/bin/cc cc $(which clang) 100
          sudo update-alternatives --install /usr/bin/c++ c++ $(which clang++) 100
          sudo update-alternatives --set cc $(which clang)
          sudo update-alternatives --set c++ $(which clang++)

          # Native Linux builds run in the AlmaLinux 8 CI image (glibc 2.28
          # floor, replacing the EOL Debian Bullseye container). The image
          # ships clang, cmake, ninja, Vulkan headers, git-lfs, dbus, and
          # gnome-keyring, so the dnf branch is a guarded safety net that
          # avoids repo traffic when the image already provides everything;
          # Ubuntu runners (used by the Android builds, which run without a
          # container) still need apt. Refresh apt indices there first: the
          # GitHub-hosted mirror lists can reference superseded package
          # versions that 404 until the index is refreshed.
          #
          # NOTE: mesa-vulkan-drivers was tried here and deliberately NOT
          # kept: the EL8 lavapipe ICD returns VK_ERROR_INITIALIZATION_FAILED
          # on the ARM runner's Cortex-A720/A520 (bullseye's mesa worked on
          # the same host), so the package installs but cannot initialize —
          # see the Run tests (Linux) exclusion comment.
          if command -v dnf >/dev/null 2>&1; then
            if ! rpm -q vulkan-loader-devel vulkan-headers ninja-build which perl perl-IPC-Cmd >/dev/null 2>&1; then
              sudo dnf install -y vulkan-loader-devel vulkan-headers ninja-build which perl perl-IPC-Cmd
            fi
          else
            sudo apt-get -o Acquire::Check-Valid-Until=false update
            sudo apt install ccache ninja-build libvulkan-dev libsecret-1-dev dbus gnome-keyring -y
          fi
          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV
      - name: Configure Windows host
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install ccache ninja -A

          # ccache only works with the Ninja generator: CMake honours
          # CMAKE_<LANG>_COMPILER_LAUNCHER for Ninja and Makefiles, and silently
          # drops it for Visual Studio. Ninja in turn does not discover the MSVC
          # environment on its own the way the Visual Studio generator does, so
          # export what vcvars64 sets up.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw "No Visual Studio install with the C++ toolset was found" }

          # Snapshot the pre-vcvars PATH so the export below can skip entries
          # the runner already provides.
          $existingPath = @($env:PATH -split ';' | ForEach-Object { $_.TrimEnd('\').ToLower() } | Where-Object { $_ })

          cmd /c "call `"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -notmatch '^([^=]+)=(.*)$') { return }
            $name, $value = $matches[1], $matches[2]
            if ($name -eq 'PATH') {
              # Export vcvars' PATH in its own order, but only entries that are
              # NEW relative to the runner PATH. Re-exporting system dirs
              # (System32 et al.) pushes them ahead of the Git Bash dirs
              # registered by the earlier "Configure bash on Windows" step;
              # System32 contains the WSL bash.exe launcher, which then
              # hijacks every later `shell: bash` step on hosts where WSL
              # cannot run ("Nested virtualization is not supported"). The
              # cl.exe directory is not on the base PATH and survives this
              # filter; vcvars emits it twice with different case
              # (HostX64/Hostx64) and duplicate entries are harmless.
              $value -split ';' |
                Where-Object { $_ -and $existingPath -notcontains $_.TrimEnd('\').ToLower() } |
                Add-Content -Path $env:GITHUB_PATH
            } elseif ($name -notmatch '^(GITHUB_|RUNNER_)') {
              "$name=$value" | Add-Content -Path $env:GITHUB_ENV
            }
          }

          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_GENERATOR=Ninja"
          Add-Content -Path $env:GITHUB_ENV -Value "CC=cl"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=cl"

          # Cap compiler concurrency on the self-hosted SG-WIN11 box: 24
          # cl.exe instances compiling zkLLVM/crypto3 headers exhaust its
          # 32 GB and page to disk (observed 2026-09: builds crawling at
          # sub-1GHz + hard paging; RDP barely updating). The bare `-j` in
          # the build step honours this env cap. Hosted Windows runners
          # (8 vCPU, fleet RAM) keep unbounded parallelism.
          if ("${{ runner.environment }}" -eq "self-hosted") {
            Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_BUILD_PARALLEL_LEVEL=12"
          }

      - name: Configure macOS host
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install ninja bash gnu-tar

          # GNU tar must come first in PATH; Homebrew prefix differs per arch.
          for gnubin in /opt/homebrew/opt/gnu-tar/libexec/gnubin /usr/local/opt/gnu-tar/libexec/gnubin; do
            if [ -d "$gnubin" ]; then
              echo "PATH=$gnubin:$PATH" >> $GITHUB_ENV
              echo "Using GNU tar from $gnubin"
              break
            fi
          done

          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      - name: Add Darwin toolchain
        if: ${{ matrix.target == 'OSX' }}
        run: rustup target add x86_64-apple-darwin

      - name: Add iOS toolchain
        if: ${{ matrix.target == 'iOS' }}
        run: |
          rustup toolchain install nightly-aarch64-apple-darwin
          rustup component add rust-src --toolchain nightly-aarch64-apple-darwin
          rustup target add aarch64-apple-ios

      - name: Add Android toolchain
        if: ${{ matrix.target == 'Android' }}
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"

          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            echo "Downloading Android command-line tools..."
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm cmdline-tools.zip
          fi

          # Always accept licenses and install/update required SDK components
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          NDK_VERSION="r27b"
          NDK_DIR="$HOME/android-ndk-$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            echo "Downloading Android NDK..."
            wget https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip -O ndk.zip
            unzip -o ndk.zip -d $HOME
            rm ndk.zip
          fi

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install Rust tooling
        run: |
          cargo install cbindgen
          rustup target add wasm32-unknown-emscripten

      - name: Pin host clang for native Linux builds
        # On AlmaLinux 8 /usr/bin/c++ is a real file owned by gcc-c++ (not an
        # alternatives symlink like Debian's), so the update-alternatives
        # takeover in "Configure Linux host" fails silently and CMake falls
        # back to g++ 8.5, which cannot compile the zkLLVM crypto3 constexpr
        # code in ProofSystem (run 35377550250, divide.hpp:347 "is not a
        # constant expression" on all Linux jobs). Setting the pin via an env
        # var keeps it scoped to native Linux targets only: Android must keep
        # the NDK toolchain-file compilers (an explicit -D would override
        # them), and the Windows/macOS hosts use their own toolchains.
        if: ${{ matrix.target == 'Linux' }}
        run: echo "COMPILER_PIN=-DCMAKE_C_COMPILER=$(which clang) -DCMAKE_CXX_COMPILER=$(which clang++)" >> $GITHUB_ENV

      - name: Configure CMake
        working-directory: ${{ github.workspace }}/SuperGenius
        # COMPILER_PIN is empty except on native Linux targets (see the
        # "Pin host clang" step above), so the other platforms configure
        # exactly as before.
        run: cmake -S build/${{ matrix.target }} -B ${{ env.BUILD_DIRECTORY }} -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} ${{ env.COMPILER_PIN }} -DTHIRDPARTY_BUILD_DIR=${{ env.THIRDPARTY_BUILD_DIR }} -DZKLLVM_BUILD_DIR=${{ env.ZKLLVM_BUILD_DIR }} ${{ matrix.cmake_args }}

      - name: Build SuperGenius
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        run: cmake --build . --config ${{ matrix.build-type }} -j

      - name: Install SuperGenius
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        run: cmake --install . --config ${{ matrix.build-type }}

      - name: Compress build artifacts
        if: ${{ env.RELEASE == 'true' }}
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        shell: bash
        run: tar --exclude=.git -czvf ${FILE_NAME} --transform 's|^|${{ env.BUILD_DIRECTORY }}/|' SuperGenius/

      - name: Create release tag
        if: github.ref_name == 'main' || github.ref_name == 'develop'
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        id: create-release-tag
        shell: bash
        run: |
          if [ "$IS_TAG" != true ] && gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Deleting existing release/tag $RELEASE_TAG..."
            gh release delete "$RELEASE_TAG" --yes || true
            git push origin ":refs/tags/$RELEASE_TAG" || true
            git tag -d "$RELEASE_TAG" || true
          fi
          git tag -f "$RELEASE_TAG" "${{ github.sha }}"
          git push origin "$RELEASE_TAG" --force
          echo "Creating GitHub release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            -t "${{ matrix.target }} ${{ github.ref_name }} ${{ matrix.build-type }} build" \
            -n "Branch: ${{ github.ref_name }} | SHA: ${{ github.sha }}" \
            $( [ "$IS_TAG" = true ] && echo "" || echo "--prerelease" )

      - name: Upload file
        if: ${{ env.RELEASE == 'true' }}
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "$FILE_NAME" --clobber

      - name: Restore CTest cost data
        if: ${{ env.RUN_TESTS == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-${{ matrix.id }}-${{ matrix.build-type }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ctest-cost-${{ matrix.id }}-${{ matrix.build-type }}-

      - name: Mark macOS diagnostic start
        if: ${{ matrix.target == 'OSX' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/macos-crash-reports"
          touch "$RUNNER_TEMP/macos-tests-started"

      - name: Run tests
        if: ${{ env.RUN_TESTS == 'true' && matrix.target != 'Linux' }}
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        # -LE requires_foundry: deterministically exclude Foundry-dependent e2e
        # suites (bridge_race_*). Without this they only "pass" via the fixture's
        # runtime GTEST_SKIP PATH probe (~1.4s) and would silently run for real
        # (failing, taking minutes) if Foundry ever lands on a runner.
        run: ctest . -j 4 -C ${{ matrix.build-type }} --output-on-failure -LE requires_foundry

      - name: Run tests (Linux)
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        if: ${{ env.RUN_TESTS == 'true' && matrix.target == 'Linux' }}
        shell: bash
        run: |
          # MNN's VulkanInstance ctor asserts (VulkanInstance.cpp:89) when
          # vkCreateInstance fails, killing the process before its own
          # graceful supportVulkan() fallback can run. On the ARM runner
          # (Cortex-A720/A520) the EL8 lavapipe ICD itself returns
          # VK_ERROR_INITIALIZATION_FAILED (verified via vulkaninfo in a
          # privileged container; bullseye's mesa initialized fine on the
          # same host — runs 35675445960 / 35701510569). Debug-only because
          # NDEBUG compiles the assert out. Skip the affected suites until
          # the MNN assert is patched to degrade gracefully (rider for the
          # next thirdparty rebuild); x86 (real GPU) and aarch64 Release
          # keep full coverage.
          # Pass exclusions through the ENVIRONMENT, never through eval'd
          # string re-parsing: eval "bash -c '... $EXCLUDE'" re-tokenizes the
          # line, and the single quotes around the regex close the outer
          # single-quoted string so the pipes become shell pipes and ctest
          # test names get executed as commands (observed in the first run
          # of this exclusion). dbus-run-session and bash -c propagate env
          # untouched.
          #
          # Two granularities:
          # - CTEST_EXCLUDE_REGEX drops suites whose EVERY case instantiates
          #   the processing manager (MNN) and would abort before reporting.
          # - GTEST_FILTER narrows the three mixed suites to their
          #   non-processing cases: only AccountManagement.SetPayoutAddress,
          #   ProcessingNodesTest.PostProcessing, and
          #   ProcessingNodesModuleTest.SinglePostProcessing touch MNN (the
          #   DISABLED_* siblings never run regardless); the remaining
          #   account/ledger/transfer cases are pure and keep running.
          # gtest filter grammar is POSITIVE-NEGATIVE with ONE dash: the
          # negative section is ':'-separated WITHOUT per-pattern dashes.
          # '-A:-B:-C' silently parses its 2nd/3rd patterns as literal
          # '-B'/'-C' (matching nothing), so the exclusions never apply and
          # the excluded cases run anyway (run 35781614193: PostProcessing
          # and SinglePostProcessing still aborted). '*-A:B:C' is the
          # unambiguous form.
          GTEST_FILTER_VALUE="*"
          if [ "${{ matrix.abi }}" = "aarch64" ] && [ "${{ matrix.build-type }}" = "Debug" ]; then
            CTEST_EXCLUDE_REGEX="processing_datatypes_test|processing_conformance_cancellation_test|processing_conformance_hashing_test|processing_conformance_migration_test|processing_conformance_regression_test|processing_conformance_security_test"
            GTEST_FILTER_VALUE="*-AccountManagement.SetPayoutAddress:ProcessingNodesTest.PostProcessing:ProcessingNodesModuleTest.SinglePostProcessing"
            echo "Skipping Vulkan-exposed cases on aarch64 Debug (see comment)"
          fi
          export CTEST_EXCLUDE_REGEX
          export GTEST_FILTER="$GTEST_FILTER_VALUE"
          dbus-run-session -- bash -c '\
            mkdir -p ~/.cache ~/.local/share/keyrings && \
            echo -n "login" > ~/.local/share/keyrings/default && \
            echo "[keyring]
            display-name=login
            lock-on-idle=false
            lock-after=false" > ~/.local/share/keyrings/login.keyring && \
            eval $(printf "\n" | gnome-keyring-daemon --unlock --components=secrets) && \
            if [ -n "$CTEST_EXCLUDE_REGEX" ]; then \
              ctest . -j 4 -C ${{ matrix.build-type }} --output-on-failure -LE requires_foundry -E "$CTEST_EXCLUDE_REGEX"; \
            else \
              ctest . -j 4 -C ${{ matrix.build-type }} --output-on-failure -LE requires_foundry; \
            fi'
          unset GTEST_FILTER

      - name: Collect macOS crash diagnostics
        id: collect_macos_crash_diagnostics
        if: ${{ failure() && matrix.target == 'OSX' }}
        shell: bash
        run: |
          marker="$RUNNER_TEMP/macos-tests-started"
          output_dir="$RUNNER_TEMP/macos-crash-reports"
          report_list="$RUNNER_TEMP/macos-crash-report-list.txt"
          echo "reports_found=false" >> "$GITHUB_OUTPUT"

          [ -f "$marker" ] || exit 0

          # ReportCrash/osanalyticshelper may write the file asynchronously.
          for attempt in $(seq 1 30); do
            find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports \
              -type f -newer "$marker" \( -name '*.ips' -o -name '*.crash' \) \
              > "$report_list" 2>/dev/null || true
            [ -s "$report_list" ] && break
            sleep 1
          done

          [ -s "$report_list" ] || exit 0
          echo "reports_found=true" >> "$GITHUB_OUTPUT"

          while IFS= read -r report; do
            cp "$report" "$output_dir/"
            echo "::group::macOS crash report: $(basename "$report")"
            cat "$report"
            echo "::endgroup::"
          done < "$report_list"

      - name: Upload macOS crash diagnostics
        if: ${{ failure() && steps.collect_macos_crash_diagnostics.outputs.reports_found == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.build-type }}-crash-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-crash-reports/
          retention-days: 14

      - name: Report GPU-gated render test skips (Windows)
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        if: ${{ matrix.build-type == 'Release' && matrix.target == 'Windows' }}
        shell: bash
        run: |
          if grep -rl "No usable Vulkan device" xunit/*.xml >/dev/null 2>&1; then
            {
              echo "## GPU-gated render test skip (${{ matrix.target }}/${{ matrix.build-type }})"
              echo
              echo "GPU-gated render tests were SKIPPED (not failed, not silently passed) on this runner:"
              echo "no usable Vulkan device (DISCRETE_GPU/INTEGRATED_GPU) was found by the runtime probe."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report GPU-gated render test skips (Linux)
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        if: ${{ matrix.target == 'Linux' }}
        shell: bash
        run: |
          if grep -rl "No usable Vulkan device" xunit/*.xml >/dev/null 2>&1; then
            {
              echo "## GPU-gated render test skip (${{ matrix.target }}/${{ matrix.build-type }})"
              echo
              echo "GPU-gated render tests were SKIPPED (not failed, not silently passed) on this runner:"
              echo "no usable Vulkan device (DISCRETE_GPU/INTEGRATED_GPU) was found by the runtime probe."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report GPU-gated render test skips (OSX)
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        if: ${{ matrix.target == 'OSX' }}
        shell: bash
        run: |
          if grep -rl "No usable Vulkan device" xunit/*.xml >/dev/null 2>&1; then
            {
              echo "## GPU-gated render test skip (${{ matrix.target }}/${{ matrix.build-type }})"
              echo
              echo "GPU-gated render tests were SKIPPED (not failed, not silently passed) on this runner:"
              echo "no usable Vulkan device (DISCRETE_GPU/INTEGRATED_GPU) was found by the runtime probe."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save CTest cost data
        if: ${{ env.RUN_TESTS == 'true' && (success() || failure()) }}
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-${{ matrix.id }}-${{ matrix.build-type }}-${{ github.run_id }}-${{ github.run_attempt }}

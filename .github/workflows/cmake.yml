name: Release Build CI

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - ".github/**"
      - "Readme.md"
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - ".github/**"
      - "Readme.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        type: string
      # Names must be build_<matrix.id>_<matrix.build-type>: the build job looks
      # them up dynamically instead of enumerating every combination.
      build_Android-arm64-v8a_Release:
        description: "Build Android arm64-v8a Release"
        default: true
        type: boolean
      build_Android-arm64-v8a_Debug:
        description: "Build Android arm64-v8a Debug"
        default: true
        type: boolean
      build_Android-armeabi-v7a_Release:
        description: "Build Android armeabi-v7a Release"
        default: true
        type: boolean
      build_Android-armeabi-v7a_Debug:
        description: "Build Android armeabi-v7a Debug"
        default: true
        type: boolean
      build_iOS_Release:
        description: "Build iOS Release"
        default: true
        type: boolean
      build_iOS_Debug:
        description: "Build iOS Debug"
        default: true
        type: boolean
      build_OSX_Release:
        description: "Build OSX Release"
        default: true
        type: boolean
      build_OSX_Debug:
        description: "Build OSX Debug"
        default: true
        type: boolean
      build_Linux-x86_64_Release:
        description: "Build Linux x86_64 Release"
        default: true
        type: boolean
      build_Linux-x86_64_Debug:
        description: "Build Linux x86_64 Debug"
        default: true
        type: boolean
      build_Linux-aarch64_Release:
        description: "Build Linux aarch64 Release"
        default: true
        type: boolean
      build_Linux-aarch64_Debug:
        description: "Build Linux aarch64 Debug"
        default: true
        type: boolean
      build_Windows_Release:
        description: "Build Windows Release"
        default: true
        type: boolean
      build_Windows_Debug:
        description: "Build Windows Debug"
        default: true
        type: boolean
permissions:
  contents: write
  packages: read
jobs:
  resolve-runners:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
      CCACHE_MAXSIZE: "30G"
    outputs:
      linux_x64: ${{ steps.pick.outputs.linux_x64 }}
      linux_arm: ${{ steps.pick.outputs.linux_arm }}
      windows: ${{ steps.pick.outputs.windows }}
      mac: ${{ steps.pick.outputs.mac }}
    steps:
      - name: Check self-hosted runner availability
        id: pick
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ORG="${REPO%%/*}"

          # Some org-scoped runners do not show up via the repo endpoint for this
          # token, so query both scopes and merge the results.
          fetch() { gh api "$1/actions/runners" --paginate 2>/dev/null || echo '{"runners":[]}'; }
          data="$(jq -n --argjson r "$(fetch "/repos/$REPO")" --argjson o "$(fetch "/orgs/$ORG")" \
            '{runners: (($r.runners // []) + ($o.runners // []) | unique_by(.id))}')"

          {
            echo "## Runner availability"
            echo
            echo "Repository: $REPO | Organization: $ORG"
            echo "Discovered runners (repo+org merged):"
            echo "$data" | jq -r '.runners[]? | "- \(.name) | status=\(.status) | busy=\(.busy) | labels=\([.labels[].name] | join(", "))"'
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # Returns ["self-hosted","<label>"] if at least one matching runner is
          # online and not busy, otherwise the GitHub-hosted fallback ($2).
          # Matches either runner name or label text, case-insensitively.
          pick() {
            if echo "$data" | jq -e --arg L "$1" \
              '.runners[]
               | select(.status=="online" and (.busy|not))
               | select((.name | ascii_downcase) == ($L | ascii_downcase)
                 or any(.labels[]; (.name | ascii_downcase) == ($L | ascii_downcase)))' \
              >/dev/null 2>&1; then
              echo "- $1: self-hosted" >> "$GITHUB_STEP_SUMMARY"
              echo "[\"self-hosted\",\"$1\"]"
            else
              echo "- $1: fallback" >> "$GITHUB_STEP_SUMMARY"
              echo "$2"
            fi
          }

          {
            echo "linux_x64=$(pick sg-ubuntu-linux '["ubuntu-latest"]')"
            echo "linux_arm=$(pick sg-arm-linux    '["ubuntu-24.04-arm"]')"
            echo "windows=$(pick   SG-WIN11        '["windows-2022"]')"
            echo "mac=$(pick       gv-OSX-Large    '["macos-latest"]')"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-runners
    env:
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
      BUILD_DIRECTORY: build/${{ matrix.target }}/${{ matrix.build-type }}${{ matrix.abi && format('/{0}', matrix.abi) || '' }}
      FILE_NAME: ${{ matrix.id }}-${{ matrix.build-type }}.tar.gz
      # zkLLVM only releases Release artifacts (except Windows, which releases both),
      # so non-Windows Debug builds link against the Release zkLLVM.
      ZK_TYPE: ${{ matrix.target == 'Windows' && matrix.build-type || 'Release' }}
      IS_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
      RELEASE: ${{ github.ref_name == 'main' || github.ref_name == 'develop' || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
      RELEASE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag) || format('{0}-{1}-{2}', matrix.id, github.ref_name, matrix.build-type) }}
      RESOLVED_BRANCH: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag) || ((github.event.pull_request.head.ref || github.ref_name) == 'main' && 'main' || 'develop') }}
      RUN_TESTS: ${{ matrix.target == 'Linux' || matrix.target == 'OSX' || (matrix.target == 'Windows' && matrix.build-type == 'Release') }}
    runs-on: ${{ fromJson(needs.resolve-runners.outputs[matrix.runner_key]) }}
    container:
      image: ${{ matrix.container }}
      options: --cap-add=IPC_LOCK
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GNUS_TOKEN_1 }}
    strategy:
      fail-fast: false
      matrix:
        target: [iOS, OSX, Windows]
        build-type: [Debug, Release]
        include:
          - target: iOS
            id: iOS
            runner_key: mac
            cmake_args: -DPLATFORM=OS64
          - target: OSX
            id: OSX
            runner_key: mac
            cmake_args: -DPLATFORM=MAC_UNIVERSAL
          - target: Windows
            id: Windows
            runner_key: windows
          - target: Linux
            id: Linux-x86_64
            abi: x86_64
            build-type: Release
            runner_key: linux_x64
            container: ghcr.io/geniusventures/debian-bullseye:latest
            cmake_args: -DSGNS_PRINT_LOGS=ON
          - target: Linux
            id: Linux-x86_64
            abi: x86_64
            build-type: Debug
            runner_key: linux_x64
            container: ghcr.io/geniusventures/debian-bullseye:latest
            cmake_args: -DSGNS_PRINT_LOGS=ON
          - target: Linux
            id: Linux-aarch64
            abi: aarch64
            build-type: Release
            runner_key: linux_arm
            container: ghcr.io/geniusventures/debian-bullseye:latest
            cmake_args: -DSGNS_PRINT_LOGS=ON
          - target: Linux
            id: Linux-aarch64
            abi: aarch64
            build-type: Debug
            runner_key: linux_arm
            container: ghcr.io/geniusventures/debian-bullseye:latest
            cmake_args: -DSGNS_PRINT_LOGS=ON
          - target: Android
            id: Android-arm64-v8a
            abi: arm64-v8a
            build-type: Release
            runner_key: linux_x64
            cmake_args: -DANDROID_ABI=arm64-v8a
          - target: Android
            id: Android-arm64-v8a
            abi: arm64-v8a
            build-type: Debug
            runner_key: linux_x64
            cmake_args: -DANDROID_ABI=arm64-v8a
          - target: Android
            id: Android-armeabi-v7a
            abi: armeabi-v7a
            build-type: Release
            runner_key: linux_x64
            cmake_args: -DANDROID_ABI=armeabi-v7a
          - target: Android
            id: Android-armeabi-v7a
            abi: armeabi-v7a
            build-type: Debug
            runner_key: linux_x64
            cmake_args: -DANDROID_ABI=armeabi-v7a
    steps:
      # Shell-agnostic body so this works on both bash and pwsh runners.
      - name: Skip build disabled by workflow_dispatch input
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs[format('build_{0}_{1}', matrix.id, matrix.build-type)] }}
        run: |
          echo "Skipping build for ${{ matrix.id }} ${{ matrix.build-type }}"
          exit 78

      - name: Configure bash on Windows (use Git Bash, not WSL)
        if: ${{ runner.environment == 'self-hosted' && matrix.target == 'Windows' }}
        run: |
          foreach ($p in @("C:\Program Files\Git\bin", "C:\Program Files\Git\usr\bin")) {
            if (Test-Path $p) {
              Add-Content -Path $env:GITHUB_PATH -Value $p
              $env:PATH = "$p;$env:PATH"
            }
          }
          $bash = (Get-Command bash.exe -ErrorAction SilentlyContinue).Source
          Write-Output $(if ($bash) { "Bash location: $bash" } else { "WARNING: bash.exe not found in PATH" })

      - name: Clean workspace (self-hosted runners)
        if: ${{ runner.environment == 'self-hosted' }}
        working-directory: ${{ runner.workspace }}
        shell: bash
        run: |
          # Container jobs leave root-owned files behind on Linux.
          SUDO=$([ "$(uname)" = Linux ] && echo sudo || echo)
          # Keep the SuperGenius directory itself, drop its contents.
          [ -d SuperGenius ] && $SUDO rm -rf SuperGenius/* SuperGenius/.[!.]* || true
          $SUDO rm -rf thirdparty zkLLVM
          ls -la

      - name: Checkout SuperGenius repository
        uses: actions/checkout@v7
        with:
          path: "SuperGenius"
          submodules: "recursive"
          persist-credentials: true # We need the credentials for uploading the release later

      - name: Download thirdparty release
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          mkdir thirdparty && cd thirdparty
          if [ "$IS_TAG" = true ]; then
            tag="$RESOLVED_BRANCH"
          else
            tag="${{ matrix.id }}-$RESOLVED_BRANCH-${{ matrix.build-type }}"
          fi
          gh release download "$tag" --repo GeniusVentures/thirdparty -p "$FILE_NAME"
          tar -zxf "$FILE_NAME"
          # CMake on Windows needs a native path, not the MSYS one.
          echo "THIRDPARTY_BUILD_DIR=$([ "${{ matrix.target }}" = Windows ] && pwd -W || pwd)/$BUILD_DIRECTORY" >> $GITHUB_ENV

      - name: Download zkLLVM release
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          mkdir zkLLVM && cd zkLLVM
          zk_file="${{ matrix.id }}-$ZK_TYPE.tar.gz"
          zk_dir="build/${{ matrix.target }}/$ZK_TYPE${{ matrix.abi && format('/{0}', matrix.abi) || '' }}"
          if [ "$IS_TAG" = true ]; then
            tag="$RESOLVED_BRANCH"
          else
            tag="${{ matrix.id }}-$RESOLVED_BRANCH-$ZK_TYPE"
          fi
          gh release download "$tag" --repo GeniusVentures/zkLLVM -p "$zk_file"
          tar --exclude='*bin/assigner' --exclude='*bin/clang-zkllvm' --exclude='*bin/llvm-link-zkllvm' --exclude='*bin/transpiler' -xzf "$zk_file"
          echo "ZKLLVM_BUILD_DIR=$([ "${{ matrix.target }}" = Windows ] && pwd -W || pwd)/$zk_dir" >> $GITHUB_ENV

      - name: Configure Linux host
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo update-alternatives --install /usr/bin/cc cc $(which clang) 100
          sudo update-alternatives --install /usr/bin/c++ c++ $(which clang++) 100
          sudo update-alternatives --set cc $(which clang)
          sudo update-alternatives --set c++ $(which clang++)

          # Refresh apt indices first: GitHub-hosted runners use
          # mirror+file:/etc/apt/apt-mirrors.txt (Azure mirrors) whose cached
          # lists can reference superseded package versions (e.g.
          # libgcrypt20-dev 1.10.3-2ubuntu0.1, a dep of libsecret-1-dev)
          # that 404 on the mirror until the index is refreshed.
          sudo apt-get update
          sudo apt install ccache ninja-build libvulkan-dev libsecret-1-dev dbus gnome-keyring -y
          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      - name: Configure Windows host
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install ccache ninja -A

          # ccache only works with the Ninja generator: CMake honours
          # CMAKE_<LANG>_COMPILER_LAUNCHER for Ninja and Makefiles, and silently
          # drops it for Visual Studio. Ninja in turn does not discover the MSVC
          # environment on its own the way the Visual Studio generator does, so
          # export what vcvars64 sets up.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw "No Visual Studio install with the C++ toolset was found" }

          cmd /c "call `"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -notmatch '^([^=]+)=(.*)$') { return }
            $name, $value = $matches[1], $matches[2]
            if ($name -eq 'PATH') {
              # Take vcvars' PATH verbatim and in its own order, so the MSVC bin
              # directory keeps precedence over the clang directories vcvars also
              # adds. Skipping entries already on PATH looked tidier but dropped
              # cl.exe's own directory, which vcvars emits as both HostX64 and
              # Hostx64; duplicate entries here are harmless.
              $value -split ';' | Where-Object { $_ } | Add-Content -Path $env:GITHUB_PATH
            } elseif ($name -notmatch '^(GITHUB_|RUNNER_)') {
              "$name=$value" | Add-Content -Path $env:GITHUB_ENV
            }
          }

          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_GENERATOR=Ninja"
          Add-Content -Path $env:GITHUB_ENV -Value "CC=cl"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=cl"

      - name: Configure macOS host
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install ninja bash gnu-tar

          # GNU tar must come first in PATH; Homebrew prefix differs per arch.
          for gnubin in /opt/homebrew/opt/gnu-tar/libexec/gnubin /usr/local/opt/gnu-tar/libexec/gnubin; do
            if [ -d "$gnubin" ]; then
              echo "PATH=$gnubin:$PATH" >> $GITHUB_ENV
              echo "Using GNU tar from $gnubin"
              break
            fi
          done

          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      - name: Add Darwin toolchain
        if: ${{ matrix.target == 'OSX' }}
        run: rustup target add x86_64-apple-darwin

      - name: Add iOS toolchain
        if: ${{ matrix.target == 'iOS' }}
        run: |
          rustup toolchain install nightly-aarch64-apple-darwin
          rustup component add rust-src --toolchain nightly-aarch64-apple-darwin
          rustup target add aarch64-apple-ios

      - name: Add Android toolchain
        if: ${{ matrix.target == 'Android' }}
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"

          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            echo "Downloading Android command-line tools..."
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm cmdline-tools.zip
          fi

          # Always accept licenses and install/update required SDK components
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          NDK_VERSION="r27b"
          NDK_DIR="$HOME/android-ndk-$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            echo "Downloading Android NDK..."
            wget https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip -O ndk.zip
            unzip -o ndk.zip -d $HOME
            rm ndk.zip
          fi

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install Rust tooling
        run: |
          cargo install cbindgen
          rustup target add wasm32-unknown-emscripten

      - name: Configure CMake
        working-directory: ${{ github.workspace }}/SuperGenius
        run: cmake -S build/${{ matrix.target }} -B ${{ env.BUILD_DIRECTORY }} -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DTHIRDPARTY_BUILD_DIR=${{ env.THIRDPARTY_BUILD_DIR }} -DZKLLVM_BUILD_DIR=${{ env.ZKLLVM_BUILD_DIR }} ${{ matrix.cmake_args }}

      - name: Build SuperGenius
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        run: cmake --build . --config ${{ matrix.build-type }} -j

      - name: Install SuperGenius
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        run: cmake --install . --config ${{ matrix.build-type }}

      - name: Compress build artifacts
        if: ${{ env.RELEASE == 'true' }}
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        shell: bash
        run: tar --exclude=.git -czvf ${FILE_NAME} --transform 's|^|${{ env.BUILD_DIRECTORY }}/|' SuperGenius/

      - name: Create release tag
        if: github.ref_name == 'main' || github.ref_name == 'develop'
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        id: create-release-tag
        shell: bash
        run: |
          if [ "$IS_TAG" != true ] && gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Deleting existing release/tag $RELEASE_TAG..."
            gh release delete "$RELEASE_TAG" --yes || true
            git push origin ":refs/tags/$RELEASE_TAG" || true
            git tag -d "$RELEASE_TAG" || true
          fi
          git tag -f "$RELEASE_TAG" "${{ github.sha }}"
          git push origin "$RELEASE_TAG" --force
          echo "Creating GitHub release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            -t "${{ matrix.target }} ${{ github.ref_name }} ${{ matrix.build-type }} build" \
            -n "Branch: ${{ github.ref_name }} | SHA: ${{ github.sha }}" \
            $( [ "$IS_TAG" = true ] && echo "" || echo "--prerelease" )

      - name: Upload file
        if: ${{ env.RELEASE == 'true' }}
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "$FILE_NAME" --clobber

      - name: Restore CTest cost data
        if: ${{ env.RUN_TESTS == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-${{ matrix.id }}-${{ matrix.build-type }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ctest-cost-${{ matrix.id }}-${{ matrix.build-type }}-

      - name: Mark macOS diagnostic start
        if: ${{ matrix.target == 'OSX' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/macos-crash-reports"
          touch "$RUNNER_TEMP/macos-tests-started"

      - name: Run tests
        if: ${{ env.RUN_TESTS == 'true' && matrix.target != 'Linux' }}
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        run: ctest . -j 4 -C ${{ matrix.build-type }} --output-on-failure

      - name: Run tests (Linux)
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        if: ${{ env.RUN_TESTS == 'true' && matrix.target == 'Linux' }}
        shell: bash
        run: |
          dbus-run-session -- bash -c '\
            mkdir -p ~/.cache ~/.local/share/keyrings && \
            echo -n "login" > ~/.local/share/keyrings/default && \
            echo "[keyring]
            display-name=login
            lock-on-idle=false
            lock-after=false" > ~/.local/share/keyrings/login.keyring && \
            eval $(printf "\n" | gnome-keyring-daemon --unlock --components=secrets) && \
            ctest . -j 4 -C ${{ matrix.build-type }} --output-on-failure'

      - name: Collect macOS crash diagnostics
        id: collect_macos_crash_diagnostics
        if: ${{ failure() && matrix.target == 'OSX' }}
        shell: bash
        run: |
          marker="$RUNNER_TEMP/macos-tests-started"
          output_dir="$RUNNER_TEMP/macos-crash-reports"
          report_list="$RUNNER_TEMP/macos-crash-report-list.txt"
          echo "reports_found=false" >> "$GITHUB_OUTPUT"

          [ -f "$marker" ] || exit 0

          # ReportCrash/osanalyticshelper may write the file asynchronously.
          for attempt in $(seq 1 30); do
            find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports \
              -type f -newer "$marker" \( -name '*.ips' -o -name '*.crash' \) \
              > "$report_list" 2>/dev/null || true
            [ -s "$report_list" ] && break
            sleep 1
          done

          [ -s "$report_list" ] || exit 0
          echo "reports_found=true" >> "$GITHUB_OUTPUT"

          while IFS= read -r report; do
            cp "$report" "$output_dir/"
            echo "::group::macOS crash report: $(basename "$report")"
            cat "$report"
            echo "::endgroup::"
          done < "$report_list"

      - name: Upload macOS crash diagnostics
        if: ${{ failure() && steps.collect_macos_crash_diagnostics.outputs.reports_found == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.build-type }}-crash-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-crash-reports/
          retention-days: 14

      - name: Report GPU-gated render test skips (Windows)
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        if: ${{ matrix.build-type == 'Release' && matrix.target == 'Windows' }}
        shell: bash
        run: |
          if grep -rl "No usable Vulkan device" xunit/*.xml >/dev/null 2>&1; then
            {
              echo "## GPU-gated render test skip (${{ matrix.target }}/${{ matrix.build-type }})"
              echo
              echo "GPU-gated render tests were SKIPPED (not failed, not silently passed) on this runner:"
              echo "no usable Vulkan device (DISCRETE_GPU/INTEGRATED_GPU) was found by the runtime probe."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report GPU-gated render test skips (Linux)
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        if: ${{ matrix.target == 'Linux' }}
        shell: bash
        run: |
          if grep -rl "No usable Vulkan device" xunit/*.xml >/dev/null 2>&1; then
            {
              echo "## GPU-gated render test skip (${{ matrix.target }}/${{ matrix.build-type }})"
              echo
              echo "GPU-gated render tests were SKIPPED (not failed, not silently passed) on this runner:"
              echo "no usable Vulkan device (DISCRETE_GPU/INTEGRATED_GPU) was found by the runtime probe."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report GPU-gated render test skips (OSX)
        working-directory: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}
        if: ${{ matrix.target == 'OSX' }}
        shell: bash
        run: |
          if grep -rl "No usable Vulkan device" xunit/*.xml >/dev/null 2>&1; then
            {
              echo "## GPU-gated render test skip (${{ matrix.target }}/${{ matrix.build-type }})"
              echo
              echo "GPU-gated render tests were SKIPPED (not failed, not silently passed) on this runner:"
              echo "no usable Vulkan device (DISCRETE_GPU/INTEGRATED_GPU) was found by the runtime probe."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save CTest cost data
        if: ${{ env.RUN_TESTS == 'true' && (success() || failure()) }}
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/SuperGenius/${{ env.BUILD_DIRECTORY }}/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-${{ matrix.id }}-${{ matrix.build-type }}-${{ github.run_id }}-${{ github.run_attempt }}

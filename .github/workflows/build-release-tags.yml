name: SuperGenius Tag Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create releases for'
        required: true
        type: string
      thirdparty_tag:
        description: 'Tag for thirdparty dependencies (defaults to main tag if not specified)'
        required: false
        type: string
      zkllvm_tag:
        description: 'Tag for zkLLVM dependencies (defaults to main tag if not specified)'
        required: false
        type: string
      # Names must be build_<target>-<abi>_<build-type>: the skip step looks
      # them up dynamically instead of enumerating every combination.
      build_Android-arm64-v8a_Release:
        description: "Build Android arm64-v8a Release"
        default: true
        type: boolean
      build_Android-arm64-v8a_Debug:
        description: "Build Android arm64-v8a Debug"
        default: true
        type: boolean
      build_Android-armeabi-v7a_Release:
        description: "Build Android armeabi-v7a Release"
        default: true
        type: boolean
      build_Android-armeabi-v7a_Debug:
        description: "Build Android armeabi-v7a Debug"
        default: true
        type: boolean
      build_iOS_Release:
        description: "Build iOS Release"
        default: true
        type: boolean
      build_iOS_Debug:
        description: "Build iOS Debug"
        default: true
        type: boolean
      build_OSX_Release:
        description: "Build OSX Release"
        default: true
        type: boolean
      build_OSX_Debug:
        description: "Build OSX Debug"
        default: true
        type: boolean
      build_Linux-x86_64_Release:
        description: "Build Linux x86_64 Release"
        default: true
        type: boolean
      build_Linux-x86_64_Debug:
        description: "Build Linux x86_64 Debug"
        default: true
        type: boolean
      build_Linux-aarch64_Release:
        description: "Build Linux aarch64 Release"
        default: true
        type: boolean
      build_Linux-aarch64_Debug:
        description: "Build Linux aarch64 Debug"
        default: true
        type: boolean
      build_Windows_Release:
        description: "Build Windows Release"
        default: true
        type: boolean
      build_Windows_Debug:
        description: "Build Windows Debug"
        default: true
        type: boolean
      run_tests:
        description: "Run the CTest suite after building (same platform gating and exclusions as Release Build CI)"
        default: false
        type: boolean
permissions:
  contents: write
  packages: read
jobs:
  resolve-runners:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
    outputs:
      linux_x64: ${{ steps.pick.outputs.linux_x64 }}
      linux_arm: ${{ steps.pick.outputs.linux_arm }}
      windows: ${{ steps.pick.outputs.windows }}
      mac: ${{ steps.pick.outputs.mac }}
    steps:
      - name: Check self-hosted runner availability
        id: pick
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ORG="${REPO%%/*}"
          repo_err="$(mktemp)"
          org_err="$(mktemp)"

          # Some org-scoped runners may not show up via the repo endpoint for this token.
          # Query both scopes and merge the results.
          if repo_data="$(gh api "/repos/$REPO/actions/runners" --paginate 2>"$repo_err")"; then
            echo "Repository runner API query succeeded for $REPO"
          else
            echo "Repository runner API query failed for $REPO; continuing with empty repo runner set"
            repo_data='{"runners":[]}'
          fi

          if org_data="$(gh api "/orgs/$ORG/actions/runners" --paginate 2>"$org_err")"; then
            echo "Organization runner API query succeeded for $ORG"
          else
            echo "Organization runner API query failed for $ORG; continuing with empty org runner set"
            org_data='{"runners":[]}'
          fi

          data="$(jq -n --argjson repo "$repo_data" --argjson org "$org_data" '{runners: (($repo.runners // []) + ($org.runners // []) | unique_by(.id))}')"

          repo_count="$(echo "$repo_data" | jq -r '(.runners // []) | length')"
          org_count="$(echo "$org_data" | jq -r '(.runners // []) | length')"
          merged_count="$(echo "$data" | jq -r '(.runners // []) | length')"

          echo "Runner counts: repo=$repo_count org=$org_count merged=$merged_count"
          if [ "$org_count" -eq 0 ] && [ -s "$org_err" ]; then
            echo "Org endpoint error output:"
            cat "$org_err"
          fi

          echo "Discovered self-hosted runners for $REPO (repo+org merged):"
          echo "$data" | jq -r '.runners[]? | "- \(.name) | status=\(.status) | busy=\(.busy) | labels=\([.labels[].name] | join(", "))"'

          {
            echo "## Runner availability"
            echo
            echo "Repository: $REPO"
            echo "Organization: $ORG"
            echo "Counts: repo=$repo_count org=$org_count merged=$merged_count"
            echo
            echo "Discovered runners (repo+org merged):"
            echo "$data" | jq -r '.runners[]? | "- \(.name) | status=\(.status) | busy=\(.busy) | labels=\([.labels[].name] | join(", "))"'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Define JSON arrays using single quotes so real double-quotes are preserved.
          SH_LINUX_X64='["self-hosted","sg-ubuntu-linux"]'
          SH_LINUX_ARM='["self-hosted","sg-arm-linux"]'
          SH_WINDOWS='["self-hosted","SG-WIN11"]'
          SH_MAC='["self-hosted","gv-OSX-Large"]'
          FB_LINUX='["ubuntu-latest"]'
          FB_LINUX_ARM='["ubuntu-24.04-arm"]'
          FB_WINDOWS='["windows-2022"]'
          FB_MAC='["macos-latest"]'

          # Returns the self-hosted label array if at least one matching runner
          # is online and not busy, otherwise returns the GitHub-hosted fallback.
          # Match either runner name or label/tag text, case-insensitively.
          pick_runner() {
            local label="$1" self_hosted="$2" fallback="$3"
            if echo "$data" | jq -e --arg L "$label" \
              '.runners[]
               | select(.status=="online" and (.busy|not))
               | select((.name | ascii_downcase) == ($L | ascii_downcase)
                 or any(.labels[]; (.name | ascii_downcase) == ($L | ascii_downcase)))' \
              >/dev/null 2>&1; then
              echo "Selector '$label' matched an available self-hosted runner" >&2
              echo "- $label: self-hosted" >> "$GITHUB_STEP_SUMMARY"
              echo "$self_hosted"
            else
              echo "Selector '$label' did not match an available self-hosted runner" >&2
              echo "- $label: fallback" >> "$GITHUB_STEP_SUMMARY"
              echo "$fallback"
            fi
          }

          echo "linux_x64=$(pick_runner 'sg-ubuntu-linux' "$SH_LINUX_X64" "$FB_LINUX")"   >> "$GITHUB_OUTPUT"
          echo "linux_arm=$(pick_runner 'sg-arm-linux'    "$SH_LINUX_ARM" "$FB_LINUX_ARM")" >> "$GITHUB_OUTPUT"
          echo "windows=$(pick_runner   'SG-WIN11'        "$SH_WINDOWS"   "$FB_WINDOWS")" >> "$GITHUB_OUTPUT"
          echo "mac=$(pick_runner       'gv-OSX-Large'    "$SH_MAC"       "$FB_MAC")"     >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-runners
    env:
      GRPC_BUILD_ENABLE_CCACHE: "ON"
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
      # Mirrors Release Build CI's RUN_TESTS platform gating: the AlmaLinux
      # containers provide the keyring/dbus runtime the account suites need;
      # Windows tests are Release-only there, Android/iOS builds have no
      # test binaries (their build dirs force TESTING OFF).
      RUN_TESTS: ${{ inputs.run_tests && (matrix.target == 'Linux' || matrix.target == 'OSX' || (matrix.target == 'Windows' && matrix.build-type == 'Release')) }}
    runs-on: ${{ fromJson(needs.resolve-runners.outputs[matrix.runner_key]) }}
    container:
      image: ${{matrix.container}}
      credentials:
        username: ${{github.actor}}
        password: ${{secrets.GNUS_TOKEN_1}}
    strategy:
      fail-fast: false
      matrix:
        target: [Android, iOS, OSX, Linux, Windows]
        build-type: [Debug,Release]
        abi: [""]
        include:
          - target: Linux
            runner_key: linux_x64
            abi: "x86_64"
            build-type: "Release"
            container: ghcr.io/geniusventures/almalinux-8:latest
          - target: Linux
            runner_key: linux_x64
            abi: "x86_64"
            build-type: "Debug"
            container: ghcr.io/geniusventures/almalinux-8:latest
          - target: Linux
            runner_key: linux_arm
            abi: "aarch64"
            build-type: "Release"
            container: ghcr.io/geniusventures/almalinux-8:latest
          - target: Linux
            runner_key: linux_arm
            abi: "aarch64"
            build-type: "Debug"
            container: ghcr.io/geniusventures/almalinux-8:latest
          - target: Windows
            runner_key: windows
          - target: OSX
            runner_key: mac
          - target: Android
            runner_key: linux_x64
            abi: arm64-v8a
            build-type: "Release"
          - target: Android
            runner_key: linux_x64
            abi: arm64-v8a
            build-type: "Debug"
          - target: Android
            runner_key: linux_x64
            abi: armeabi-v7a
            build-type: "Release"
          - target: Android
            runner_key: linux_x64
            abi: armeabi-v7a
            build-type: "Debug"
          - target: iOS
            runner_key: mac
        exclude:
          - target: Android
            abi: ""
          - target: Linux
            abi: ""
    steps:
      # Shell-agnostic body so this works on both bash and pwsh runners.
      - name: Skip build disabled by workflow_dispatch input
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs[format('build_{0}{1}_{2}', matrix.target, matrix.abi && format('-{0}', matrix.abi) || '', matrix.build-type)] }}
        run: |
          echo "Skipping build for ${{ matrix.target }}${{ matrix.abi && format(' {0}', matrix.abi) || '' }} ${{ matrix.build-type }}"
          exit 78

      - name: Configure bash on Windows (use Git Bash, not WSL)
        if: ${{ runner.environment == 'self-hosted' && matrix.target == 'Windows' }}
        run: |
          foreach ($p in @("C:\Program Files\Git\bin", "C:\Program Files\Git\usr\bin")) {
            if (Test-Path $p) {
              Add-Content -Path $env:GITHUB_PATH -Value $p
              $env:PATH = "$p;$env:PATH"
            }
          }
          $bash = (Get-Command bash.exe -ErrorAction SilentlyContinue).Source
          Write-Output $(if ($bash) { "Bash location: $bash" } else { "WARNING: bash.exe not found in PATH" })

      - name: Clean workspace (self-hosted runners - Unix)
        if: ${{ runner.environment == 'self-hosted' && matrix.target != 'Windows' }}
        working-directory: ${{runner.workspace}}
        run: |
          echo "=== PRE-CLEANUP DEBUG ==="
          echo "Current working directory: $(pwd)"
          echo "Runner workspace: ${RUNNER_WORKSPACE}"
          echo "GitHub workspace: ${{github.workspace}}"

          # Use sudo on Linux to handle root-owned files left by container jobs
          SUDO=""
          if [ "$(uname)" = "Linux" ]; then
            SUDO="sudo"
          fi

          echo "=== CLEANUP ARTIFACTS ==="
          # Clean up artifacts from previous runs (self-hosted runners only)
          
          # Clean contents of SuperGenius directory but keep the directory itself
          if [ -d "SuperGenius" ]; then
            echo "Cleaning SuperGenius directory contents..."
            $SUDO rm -rf SuperGenius/* SuperGenius/.* 2>/dev/null || true
            echo "SuperGenius directory cleaned (kept the directory)"
          fi
          
          # Delete sibling dependency directories completely
          if [ -d "thirdparty" ]; then
            echo "Removing thirdparty directory..."
            $SUDO rm -rf thirdparty
          fi
          if [ -d "zkLLVM" ]; then
            echo "Removing zkLLVM directory..."
            $SUDO rm -rf zkLLVM
          fi

          echo "=== POST-CLEANUP DEBUG ==="
          echo "Runner workspace contents:"
          ls -la
          if [ -d "SuperGenius" ]; then
            echo "SuperGenius directory exists and contains:"
            ls -la SuperGenius/ 2>/dev/null || echo "  (empty)"
          fi
        shell: bash
        env:
          RUNNER_WORKSPACE: ${{runner.workspace}}

      - name: Clean workspace (self-hosted runners - Windows)
        if: ${{ runner.environment == 'self-hosted' && matrix.target == 'Windows' }}
        working-directory: ${{runner.workspace}}
        run: |
          Write-Output "=== PRE-CLEANUP DEBUG ==="
          Write-Output "Current working directory: $(Get-Location)"
          Write-Output "Runner workspace: ${{runner.workspace}}"
          Write-Output "GitHub workspace: ${{github.workspace}}"

          Write-Output "=== CLEANUP ARTIFACTS ==="
          # Clean up artifacts from previous runs (self-hosted runners only)
          
          # Clean contents of SuperGenius directory but keep the directory itself
          if (Test-Path "SuperGenius") {
            Write-Output "Cleaning SuperGenius directory contents..."
            Get-ChildItem -Path "SuperGenius" -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Write-Output "SuperGenius directory cleaned (kept the directory)"
          }
          
          # Delete sibling dependency directories completely
          if (Test-Path "thirdparty") {
            Write-Output "Removing thirdparty directory..."
            Remove-Item -Path "thirdparty" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "zkLLVM") {
            Write-Output "Removing zkLLVM directory..."
            Remove-Item -Path "zkLLVM" -Recurse -Force -ErrorAction SilentlyContinue
          }

          Write-Output "=== POST-CLEANUP DEBUG ==="
          Write-Output "Runner workspace contents:"
          Get-ChildItem -Force
          if (Test-Path "SuperGenius") {
            Write-Output "SuperGenius directory exists and contains:"
            Get-ChildItem -Path "SuperGenius" -Force -ErrorAction SilentlyContinue | Out-Null
            if ($?) { Get-ChildItem -Path "SuperGenius" -Force } else { Write-Output "  (empty)" }
          }

      - name: Install git-lfs (Linux containers)
        # Ported from Release Build CI: the VALD cross-machine .cap fixtures
        # under test/src/processing/fixtures/ are tracked via Git LFS; without
        # lfs: true the checkout materializes 134-byte pointer files and
        # processing_validation_core_test's DeserializeCaptureFile correctly
        # rejects them (cmake.yml run 35045845230). The AlmaLinux 8 CI image
        # bakes git-lfs in (via EPEL) so this is usually a no-op there; the
        # guarded static-binary drop-in covers any Linux host without it.
        if: ${{ runner.os == 'Linux' }}
        run: |
          if command -v git-lfs >/dev/null 2>&1; then
            echo "git-lfs already present: $(git-lfs version)"
            exit 0
          fi
          arch="$(uname -m)"
          case "$arch" in
            x86_64)  lfs_arch="amd64" ;;
            aarch64) lfs_arch="arm64" ;;
            *) echo "Unsupported architecture for git-lfs download: $arch"; exit 1 ;;
          esac
          url="https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-${lfs_arch}-v3.7.1.tar.gz"
          if command -v curl >/dev/null 2>&1; then
            curl -fsSL --retry 3 -o /tmp/git-lfs.tgz "$url"
          elif command -v wget >/dev/null 2>&1; then
            wget -q --tries=3 -O /tmp/git-lfs.tgz "$url"
          else
            echo "ERROR: neither curl nor wget found in container"; exit 1
          fi
          tar -xzf /tmp/git-lfs.tgz -C /tmp
          sudo install -m 0755 /tmp/git-lfs-3.7.1/git-lfs /usr/local/bin/git-lfs
          rm -rf /tmp/git-lfs.tgz /tmp/git-lfs-3.7.1
          git-lfs version

      - name: Checkout SuperGenius repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: "SuperGenius"
          submodules: "recursive"
          ref: ${{ github.event.inputs.tag }}
          lfs: true
          persist-credentials: true # We need the credentials for uploading the release later

      - name: Set build directory
        run: |
          if [ '${{matrix.abi}}' ]; then
            BUILD_DIRECTORY=build/${{matrix.target}}/${{matrix.build-type}}/${{matrix.abi}}
          else
            BUILD_DIRECTORY=build/${{matrix.target}}/${{matrix.build-type}}
          fi
          echo "BUILD_DIRECTORY=$BUILD_DIRECTORY" >> $GITHUB_ENV
        shell: bash

      - name: Download thirdparty release
        working-directory: ${{github.workspace}}
        shell: bash
        env:
          THIRDPARTY_TAG: ${{github.event.inputs.thirdparty_tag || github.event.inputs.tag}}
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG_NAME="${GITHUB_EVENT_INPUTS_TAG}"
          echo "Building for tag: ${TAG_NAME}"
          echo "Using thirdparty tag: ${THIRDPARTY_TAG}"

          if [ '${{matrix.abi}}' ]; then
            FILE_NAME=${{matrix.target}}-${{matrix.abi}}-${{matrix.build-type}}.tar.gz
          else
            FILE_NAME=${{matrix.target}}-${{matrix.build-type}}.tar.gz
          fi
          echo "FILE_NAME=${FILE_NAME}" >> $GITHUB_ENV

          mkdir thirdparty
          cd thirdparty

          # Download from the specified thirdparty tag's release
          echo "Downloading thirdparty from tag: ${THIRDPARTY_TAG}"

          gh release download ${THIRDPARTY_TAG} --repo GeniusVentures/thirdparty -p "${FILE_NAME}"
          tar -zxf "${FILE_NAME}"

          # Set THIRDPARTY_BUILD_DIR to the actual location where files were extracted
          if [ "${{ matrix.target }}" = "Windows" ]; then
            # Convert Unix path to Windows path for Windows builds
            echo "THIRDPARTY_BUILD_DIR=$(pwd -W)/${BUILD_DIRECTORY}" >> $GITHUB_ENV
          else
            echo "THIRDPARTY_BUILD_DIR=$(pwd)/${BUILD_DIRECTORY}" >> $GITHUB_ENV
          fi

      - name: Download zkLLVM release
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          TAG_NAME="${GITHUB_EVENT_INPUTS_TAG}"
          echo "Using zkLLVM tag: ${ZKLLVM_TAG}"
          
          mkdir zkLLVM
          cd zkLLVM

          echo "Downloading zkLLVM from tag: ${ZKLLVM_TAG}"

          if [ "${{ matrix.target }}" = "Windows" ]; then
              ZKLLVM_FILE_NAME=${{matrix.target}}-${{matrix.build-type}}.tar.gz
              ZKLLVM_BUILD_DIR=build/${{matrix.target}}/${{matrix.build-type}}
          elif [ '${{matrix.abi}}' ]; then
              ZKLLVM_FILE_NAME=${{matrix.target}}-${{matrix.abi}}-Release.tar.gz
              ZKLLVM_BUILD_DIR=build/${{matrix.target}}/Release/${{matrix.abi}}
          else
              ZKLLVM_FILE_NAME=${{matrix.target}}-Release.tar.gz
              ZKLLVM_BUILD_DIR=build/${{matrix.target}}/Release
          fi

          gh release download ${ZKLLVM_TAG} --repo GeniusVentures/zkLLVM -p "${ZKLLVM_FILE_NAME}"

          tar --exclude='*bin/assigner' --exclude='*bin/clang-zkllvm' --exclude='*bin/llvm-link-zkllvm' --exclude='*bin/transpiler' -xzf "${ZKLLVM_FILE_NAME}"

          # Set ZKLLVM_BUILD_DIR to the actual location where files were extracted

          if [ "${{ matrix.target }}" = "Windows" ]; then
            # Convert Unix path to Windows path for Windows builds
            echo "ZKLLVM_BUILD_DIR=$(pwd -W)/${ZKLLVM_BUILD_DIR}" >> $GITHUB_ENV
          else
            echo "ZKLLVM_BUILD_DIR=$(pwd)/${ZKLLVM_BUILD_DIR}" >> $GITHUB_ENV
          fi
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}
          ZKLLVM_TAG: ${{ github.event.inputs.zkllvm_tag || github.event.inputs.tag }}

      - name: Configure Linux host
        if: ${{ runner.os == 'Linux'}}
        run: |
          sudo update-alternatives --install /usr/bin/cc cc $(which clang) 100
          sudo update-alternatives --install /usr/bin/c++ c++ $(which clang++) 100
          sudo update-alternatives --set cc $(which clang)
          sudo update-alternatives --set c++ $(which clang++)

          # Native Linux builds run in the AlmaLinux 8 CI image (glibc 2.28
          # floor, replacing the EOL Debian Bullseye container). The image
          # ships clang, cmake, ninja, Vulkan headers, and the perl modules
          # OpenSSL's Configure needs, so the dnf branch is a guarded safety
          # net that avoids repo traffic when the image already provides
          # everything; Ubuntu runners (used by the Android builds, which run
          # without a container) still need apt.
          if command -v dnf >/dev/null 2>&1; then
            if ! rpm -q vulkan-loader-devel vulkan-headers ninja-build which perl perl-IPC-Cmd >/dev/null 2>&1; then
              sudo dnf install -y vulkan-loader-devel vulkan-headers ninja-build which perl perl-IPC-Cmd
            fi
          else
            sudo apt install ccache ninja-build libvulkan-dev libsecret-1-dev -y
          fi
          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      - name: Configure Windows host
        if: ${{ runner.os == 'Windows'}}
        run: |
          choco install ccache ninja -A

          # ccache only works with the Ninja generator: CMake honours
          # CMAKE_<LANG>_COMPILER_LAUNCHER for Ninja and Makefiles, and silently
          # drops it for Visual Studio. Ninja in turn does not discover the MSVC
          # environment on its own the way the Visual Studio generator does, so
          # export what vcvars64 sets up.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw "No Visual Studio install with the C++ toolset was found" }

          # Snapshot the pre-vcvars PATH so the export below can skip entries
          # the runner already provides.
          $existingPath = @($env:PATH -split ';' | ForEach-Object { $_.TrimEnd('\').ToLower() } | Where-Object { $_ })

          cmd /c "call `"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -notmatch '^([^=]+)=(.*)$') { return }
            $name, $value = $matches[1], $matches[2]
            if ($name -eq 'PATH') {
              # Export vcvars' PATH in its own order, but only entries that are
              # NEW relative to the runner PATH. Re-exporting system dirs
              # (System32 et al.) pushes them ahead of the Git Bash dirs
              # registered by the earlier "Configure bash on Windows" step;
              # System32 contains the WSL bash.exe launcher, which then
              # hijacks every later `shell: bash` step on hosts where WSL
              # cannot run ("Nested virtualization is not supported"). The
              # cl.exe directory is not on the base PATH and survives this
              # filter; vcvars emits it twice with different case
              # (HostX64/Hostx64) and duplicate entries are harmless.
              $value -split ';' |
                Where-Object { $_ -and $existingPath -notcontains $_.TrimEnd('\').ToLower() } |
                Add-Content -Path $env:GITHUB_PATH
            } elseif ($name -notmatch '^(GITHUB_|RUNNER_)') {
              "$name=$value" | Add-Content -Path $env:GITHUB_ENV
            }
          }

          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_GENERATOR=Ninja"
          Add-Content -Path $env:GITHUB_ENV -Value "CC=cl"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=cl"

          # Cap compiler concurrency on the self-hosted SG-WIN11 box: 24
          # cl.exe instances compiling zkLLVM/crypto3 headers exhaust its
          # 32 GB and page to disk (observed 2026-09: builds crawling at
          # sub-1GHz + hard paging; RDP barely updating). The bare `-j` in
          # the build step honours this env cap. Hosted Windows runners
          # (8 vCPU, fleet RAM) keep unbounded parallelism.
          if ("${{ runner.environment }}" -eq "self-hosted") {
            Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_BUILD_PARALLEL_LEVEL=8"
          }

      - name: Configure macOS host
        if: ${{ runner.os == 'macOS'}}
        run: |
          brew install ninja bash gnu-tar
          
          # Ensure GNU tar is first in PATH - check both possible Homebrew locations
          if [ -d "/opt/homebrew/opt/gnu-tar/libexec/gnubin" ]; then
            echo "PATH=/opt/homebrew/opt/gnu-tar/libexec/gnubin:$PATH" >> $GITHUB_ENV
            echo "Using GNU tar from /opt/homebrew"
          elif [ -d "/usr/local/opt/gnu-tar/libexec/gnubin" ]; then
            echo "PATH=/usr/local/opt/gnu-tar/libexec/gnubin:$PATH" >> $GITHUB_ENV
            echo "Using GNU tar from /usr/local"
          else
            echo "WARNING: GNU tar installation not found in expected locations"
            echo "Available tar: $(which tar)"
          fi
          
          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      - name: Add Darwin toolchain
        if: ${{ matrix.target == 'OSX'}}
        run: rustup target add x86_64-apple-darwin

      - name: Add iOS toolchain
        if: ${{ matrix.target == 'iOS' }}
        run: |
          rustup toolchain install nightly-aarch64-apple-darwin
          rustup component add rust-src --toolchain nightly-aarch64-apple-darwin
          rustup target add aarch64-apple-ios

      - name: Add Android toolchain
        if: ${{ matrix.target == 'Android' }}
        run: |
          # Setup Android SDK
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          
          # Download command-line tools if not present
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            echo "Downloading Android command-line tools..."
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm cmdline-tools.zip
          else
            echo "Android command-line tools already exist"
          fi
          
          # Always accept licenses and install/update required SDK components
          echo "Installing/updating Android SDK components..."
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          
          # Set environment variables
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          
          # Verify SDK installation
          echo "=== Android SDK Setup ==="
          echo "ANDROID_HOME: $ANDROID_SDK_ROOT"
          echo "SDK contents:"
          ls -la "$ANDROID_SDK_ROOT"

          # Download and setup Android NDK
          NDK_VERSION="r27b"
          NDK_DIR="$HOME/android-ndk-$NDK_VERSION"
          
          if [ ! -d "$NDK_DIR" ]; then
            echo "Downloading Android NDK..."
            wget https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip -O ndk.zip
            unzip -o ndk.zip -d $HOME
            rm ndk.zip
          else
            echo "Android NDK already exists at $NDK_DIR, skipping download"
          fi

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install bindgen
        run: cargo install cbindgen

      - name: Add wasm Rust target
        run: rustup target add wasm32-unknown-emscripten

      - name: Configure CMake for Android
        if: ${{ matrix.target == 'Android'}}
        working-directory: ${{github.workspace}}/SuperGenius
        run: cmake -S build/${{matrix.target}} -B $BUILD_DIRECTORY -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DSGNS_NETWORK=release -DANDROID_ABI=${{matrix.abi}} -DTHIRDPARTY_DIR=${{github.workspace}}/thirdparty -DTHIRDPARTY_BUILD_DIR=${{env.THIRDPARTY_BUILD_DIR}} -DZKLLVM_DIR=${{env.ZKLLVM_BUILD_DIR}} -DZKLLVM_BUILD_DIR=${{env.ZKLLVM_BUILD_DIR}}

      - name: Configure CMake for Mac
        if: ${{ matrix.target == 'OSX'}}
        working-directory: ${{github.workspace}}/SuperGenius
        run: cmake -S build/${{matrix.target}} -B $BUILD_DIRECTORY -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DSGNS_NETWORK=release -DPLATFORM=MAC_UNIVERSAL -DTHIRDPARTY_DIR=${{github.workspace}}/thirdparty -DTHIRDPARTY_BUILD_DIR=${{env.THIRDPARTY_BUILD_DIR}} -DZKLLVM_DIR=${{env.ZKLLVM_BUILD_DIR}} -DZKLLVM_BUILD_DIR=${{env.ZKLLVM_BUILD_DIR}}

      - name: Configure CMake for iOS
        if: ${{ matrix.target == 'iOS'}}
        working-directory: ${{github.workspace}}/SuperGenius
        run: cmake -S build/${{matrix.target}} -B $BUILD_DIRECTORY -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DSGNS_NETWORK=release -DPLATFORM=OS64 -DTHIRDPARTY_DIR=${{github.workspace}}/thirdparty -DTHIRDPARTY_BUILD_DIR=${{env.THIRDPARTY_BUILD_DIR}} -DZKLLVM_DIR=${{env.ZKLLVM_BUILD_DIR}} -DZKLLVM_BUILD_DIR=${{env.ZKLLVM_BUILD_DIR}}

      - name: Configure CMake for Linux
        if: ${{matrix.target == 'Linux'}}
        working-directory: ${{github.workspace}}/SuperGenius
        # Pin clang explicitly rather than relying on the /usr/bin/cc and
        # /usr/bin/c++ update-alternatives symlinks: on AlmaLinux 8
        # /usr/bin/c++ is a real file owned by gcc-c++ (not an alternatives
        # symlink like Debian's), so the update-alternatives takeover fails
        # silently and CMake falls back to g++ 8.5, which cannot compile the
        # zkLLVM crypto3 constexpr code in ProofSystem (run 35377550250,
        # divide.hpp:347 "is not a constant expression" on all Linux jobs).
        run: cmake -S build/${{matrix.target}} -B $BUILD_DIRECTORY -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DSGNS_NETWORK=release -DCMAKE_C_COMPILER=$(which clang) -DCMAKE_CXX_COMPILER=$(which clang++) -DTHIRDPARTY_DIR=${{github.workspace}}/thirdparty -DTHIRDPARTY_BUILD_DIR=${{env.THIRDPARTY_BUILD_DIR}} -DZKLLVM_DIR=${{env.ZKLLVM_BUILD_DIR}} -DZKLLVM_BUILD_DIR=${{env.ZKLLVM_BUILD_DIR}} -DABI_SUBFOLDER_NAME=${{matrix.abi}}

      - name: Configure CMake for Windows
        if: ${{matrix.target == 'Windows'}}
        working-directory: ${{github.workspace}}/SuperGenius
        run: cmake -S build/${{matrix.target}} -B $env:BUILD_DIRECTORY -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DSGNS_NETWORK=release -DTHIRDPARTY_DIR=${{github.workspace}}/thirdparty -DTHIRDPARTY_BUILD_DIR=${{env.THIRDPARTY_BUILD_DIR}}  -DZKLLVM_DIR=${{env.ZKLLVM_BUILD_DIR}} -DZKLLVM_BUILD_DIR=${{env.ZKLLVM_BUILD_DIR}}

      - name: Build SuperGenius
        working-directory: ${{github.workspace}}/SuperGenius/${{env.BUILD_DIRECTORY}}
        run: cmake --build . --config ${{matrix.build-type}} -j

      - name: Install SuperGenius
        working-directory: ${{github.workspace}}/SuperGenius/${{env.BUILD_DIRECTORY}}
        run: cmake --install . --config ${{matrix.build-type}}

      # --- Optional test stage (run_tests input; mirrors Release Build CI) ---
      # max(8, cores). Split by OS because `shell: bash` on the self-hosted
      # Windows runner resolves to WSL bash, which has no /bin/bash.
      - name: Pick ctest parallelism
        if: ${{ env.RUN_TESTS == 'true' && runner.os != 'Windows' }}
        shell: bash
        run: |
          CORES=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          echo "CTEST_JOBS=$(( CORES > 8 ? CORES : 8 ))" >> "$GITHUB_ENV"

      - name: Pick ctest parallelism (Windows)
        if: ${{ env.RUN_TESTS == 'true' && runner.os == 'Windows' }}
        shell: powershell
        run: Add-Content -Path $env:GITHUB_ENV -Value "CTEST_JOBS=$([Math]::Max(8, [Environment]::ProcessorCount))"

      - name: Run tests
        if: ${{ env.RUN_TESTS == 'true' && matrix.target != 'Linux' }}
        working-directory: ${{github.workspace}}/SuperGenius/${{env.BUILD_DIRECTORY}}
        run: ctest . -j ${{ env.CTEST_JOBS }} -C ${{ matrix.build-type }} --output-on-failure -LE requires_foundry

      - name: Run tests (Linux)
        if: ${{ env.RUN_TESTS == 'true' && matrix.target == 'Linux' }}
        working-directory: ${{github.workspace}}/SuperGenius/${{env.BUILD_DIRECTORY}}
        shell: bash
        run: |
          # MNN's VulkanInstance ctor asserts (VulkanInstance.cpp:89) when
          # vkCreateInstance fails, killing the process before its own
          # graceful supportVulkan() fallback can run. On the ARM runner
          # (Cortex-A720/A520) the EL8 lavapipe ICD itself returns
          # VK_ERROR_INITIALIZATION_FAILED (verified via vulkaninfo in a
          # privileged container; bullseye's mesa initialized fine on the
          # same host — runs 35675445960 / 35701510569). Debug-only because
          # NDEBUG compiles the assert out. Skip the affected suites until
          # the MNN assert is patched to degrade gracefully (rider for the
          # next thirdparty rebuild); x86 (real GPU) and aarch64 Release
          # keep full coverage.
          # Pass exclusions through the ENVIRONMENT, never through eval'd
          # string re-parsing: eval "bash -c '... $EXCLUDE'" re-tokenizes the
          # line, and the single quotes around the regex close the outer
          # single-quoted string so the pipes become shell pipes and ctest
          # test names get executed as commands (observed in the first run
          # of this exclusion). dbus-run-session and bash -c propagate env
          # untouched.
          #
          # Two granularities:
          # - CTEST_EXCLUDE_REGEX drops suites whose EVERY case instantiates
          #   the processing manager (MNN) and would abort before reporting.
          # - GTEST_FILTER narrows the two mixed suites to their
          #   non-processing cases: only ProcessingNodesTest.PostProcessing
          #   and ProcessingNodesModuleTest.SinglePostProcessing touch MNN
          #   (the DISABLED_* siblings never run regardless); the remaining
          #   account/ledger/transfer cases are pure and keep running.
          #   AccountManagement.SetPayoutAddress was previously excluded
          #   here too, but is hermetic since Phase 4 (stub-backed
          #   LocalPriceManager, no live CoinGecko) and runs again.
          # gtest filter grammar is POSITIVE-NEGATIVE with ONE dash: the
          # negative section is ':'-separated WITHOUT per-pattern dashes.
          # '-A:-B:-C' silently parses its 2nd/3rd patterns as literal
          # '-B'/'-C' (matching nothing), so the exclusions never apply and
          # the excluded cases run anyway (run 35781614193: PostProcessing
          # and SinglePostProcessing still aborted). '*-A:B:C' is the
          # unambiguous form.
          GTEST_FILTER_VALUE="*"
          if [ "${{ matrix.abi }}" = "aarch64" ] && [ "${{ matrix.build-type }}" = "Debug" ]; then
            CTEST_EXCLUDE_REGEX="processing_datatypes_test|processing_conformance_cancellation_test|processing_conformance_hashing_test|processing_conformance_migration_test|processing_conformance_regression_test|processing_conformance_security_test"
            GTEST_FILTER_VALUE="*-ProcessingNodesTest.PostProcessing:ProcessingNodesModuleTest.SinglePostProcessing"
            echo "Skipping Vulkan-exposed cases on aarch64 Debug (see comment)"
          fi
          export CTEST_EXCLUDE_REGEX
          export GTEST_FILTER="$GTEST_FILTER_VALUE"
          dbus-run-session -- bash -c '\
            mkdir -p ~/.cache ~/.local/share/keyrings && \
            echo -n "login" > ~/.local/share/keyrings/default && \
            echo "[keyring]
            display-name=login
            lock-on-idle=false
            lock-after=false" > ~/.local/share/keyrings/login.keyring && \
            eval $(printf "\n" | gnome-keyring-daemon --unlock --components=secrets) && \
            if [ -n "$CTEST_EXCLUDE_REGEX" ]; then \
              ctest . -j ${{ env.CTEST_JOBS }} -C ${{ matrix.build-type }} --output-on-failure -LE requires_foundry -E "$CTEST_EXCLUDE_REGEX"; \
            else \
              ctest . -j ${{ env.CTEST_JOBS }} -C ${{ matrix.build-type }} --output-on-failure -LE requires_foundry; \
            fi'
          unset GTEST_FILTER

      # Segfault triage (Linux): the price/account suites crash inside the
      # first sgns::HTTPClient exchange on EL8 (both arches; hermetic stub,
      # so Windows-only green masked it). Under dbus-run-session a crashing
      # test leaves no stack, so re-run each SEGFAULTed binary under gdb with
      # batch commands and echo the backtrace straight into the job log.
      # Best-effort: gdb absence or a clean re-run never fails the job.
      - name: Capture segfault backtraces (Linux)
        if: ${{ failure() && matrix.target == 'Linux' }}
        working-directory: ${{github.workspace}}/SuperGenius/${{env.BUILD_DIRECTORY}}
        shell: bash
        run: |
          if ! command -v gdb >/dev/null 2>&1; then
            echo "gdb not available on this image; skipping backtrace capture"
            exit 0
          fi
          export GTEST_FILTER="*-ProcessingNodesTest.PostProcessing:ProcessingNodesModuleTest.SinglePostProcessing"
          for bin in price_http_client_test price_facade_test price_retrieval_test account_management_test; do
            exe="test_bin/${bin}"
            [ -x "$exe" ] || continue
            echo "=================================================="
            echo "::group::gdb backtrace: ${bin}"
            gdb -q -batch \
              -ex "set pagination off" \
              -ex "run" \
              -ex "echo \n======== BACKTRACE ========\n" \
              -ex "bt" \
              -ex "echo \n======== ALL THREADS ========\n" \
              -ex "thread apply all bt 15" \
              --args "$exe" 2>&1 | tail -n 200
            echo "::endgroup::"
          done
          exit 0

      - name: Create or check release
        shell: bash
        working-directory: ${{github.workspace}}/SuperGenius
        run: |
          TAG_NAME="${GITHUB_EVENT_INPUTS_TAG}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          echo "Checking if GitHub release exists for tag: $TAG_NAME"

          set +e
          gh release view $TAG_NAME
          releaseFound=$?
          set -e

          if [[ $releaseFound -ne 0 ]]; then
              echo "Release not found, creating for tag: $TAG_NAME"

              # Create a single release for the tag
              gh release create $TAG_NAME \
                  -n "Build artifacts for tag ${TAG_NAME}" \
                  -t "${TAG_NAME} build artifacts"
          else
              echo "Release already exists for tag: $TAG_NAME"
          fi
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}

      - name: Compress build artifacts
        working-directory: ${{github.workspace}}/SuperGenius/${{env.BUILD_DIRECTORY}}
        run: |
          tar --exclude=.git -czvf ${FILE_NAME} --transform 's|^|${{env.BUILD_DIRECTORY}}/|' SuperGenius/
        shell: bash

      - name: Release file
        working-directory: ${{github.workspace}}/SuperGenius/${{env.BUILD_DIRECTORY}}
        shell: bash
        run: |
          echo -e "Uploading ${FILE_NAME} to release ${TAG_NAME}"
          gh release upload --clobber ${TAG_NAME} ${FILE_NAME}

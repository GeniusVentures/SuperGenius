name: SuperGenius Tag Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create releases for'
        required: true
        type: string
      thirdparty_tag:
        description: 'Tag for thirdparty dependencies (defaults to main tag if not specified)'
        required: false
        type: string
      zkllvm_tag:
        description: 'Tag for zkLLVM dependencies (defaults to main tag if not specified)'
        required: false
        type: string
permissions:
  contents: write
  packages: read
jobs:
  resolve-runners:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
    outputs:
      linux_x64: ${{ steps.pick.outputs.linux_x64 }}
      linux_arm: ${{ steps.pick.outputs.linux_arm }}
      windows: ${{ steps.pick.outputs.windows }}
      mac: ${{ steps.pick.outputs.mac }}
    steps:
      - name: Check self-hosted runner availability
        id: pick
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ORG="${REPO%%/*}"
          repo_err="$(mktemp)"
          org_err="$(mktemp)"

          # Some org-scoped runners may not show up via the repo endpoint for this token.
          # Query both scopes and merge the results.
          if repo_data="$(gh api "/repos/$REPO/actions/runners" --paginate 2>"$repo_err")"; then
            echo "Repository runner API query succeeded for $REPO"
          else
            echo "Repository runner API query failed for $REPO; continuing with empty repo runner set"
            repo_data='{"runners":[]}'
          fi

          if org_data="$(gh api "/orgs/$ORG/actions/runners" --paginate 2>"$org_err")"; then
            echo "Organization runner API query succeeded for $ORG"
          else
            echo "Organization runner API query failed for $ORG; continuing with empty org runner set"
            org_data='{"runners":[]}'
          fi

          data="$(jq -n --argjson repo "$repo_data" --argjson org "$org_data" '{runners: (($repo.runners // []) + ($org.runners // []) | unique_by(.id))}')"

          repo_count="$(echo "$repo_data" | jq -r '(.runners // []) | length')"
          org_count="$(echo "$org_data" | jq -r '(.runners // []) | length')"
          merged_count="$(echo "$data" | jq -r '(.runners // []) | length')"

          echo "Runner counts: repo=$repo_count org=$org_count merged=$merged_count"
          if [ "$org_count" -eq 0 ] && [ -s "$org_err" ]; then
            echo "Org endpoint error output:"
            cat "$org_err"
          fi

          echo "Discovered self-hosted runners for $REPO (repo+org merged):"
          echo "$data" | jq -r '.runners[]? | "- \(.name) | status=\(.status) | busy=\(.busy) | labels=\([.labels[].name] | join(", "))"'

          {
            echo "## Runner availability"
            echo
            echo "Repository: $REPO"
            echo "Organization: $ORG"
            echo "Counts: repo=$repo_count org=$org_count merged=$merged_count"
            echo
            echo "Discovered runners (repo+org merged):"
            echo "$data" | jq -r '.runners[]? | "- \(.name) | status=\(.status) | busy=\(.busy) | labels=\([.labels[].name] | join(", "))"'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Define JSON arrays using single quotes so real double-quotes are preserved.
          SH_LINUX_X64='["self-hosted","sg-ubuntu-linux"]'
          SH_LINUX_ARM='["self-hosted","sg-arm-linux"]'
          SH_WINDOWS='["self-hosted","SG-WIN11"]'
          SH_MAC='["self-hosted","gv-OSX-Large"]'
          FB_LINUX='["ubuntu-latest"]'
          FB_LINUX_ARM='["ubuntu-24.04-arm"]'
          FB_WINDOWS='["windows-2022"]'
          FB_MAC='["macos-latest"]'

          # Returns the self-hosted label array if at least one matching runner
          # is online and not busy, otherwise returns the GitHub-hosted fallback.
          # Match either runner name or label/tag text, case-insensitively.
          pick_runner() {
            local label="$1" self_hosted="$2" fallback="$3"
            if echo "$data" | jq -e --arg L "$label" \
              '.runners[]
               | select(.status=="online" and (.busy|not))
               | select((.name | ascii_downcase) == ($L | ascii_downcase)
                 or any(.labels[]; (.name | ascii_downcase) == ($L | ascii_downcase)))' \
              >/dev/null 2>&1; then
              echo "Selector '$label' matched an available self-hosted runner" >&2
              echo "- $label: self-hosted" >> "$GITHUB_STEP_SUMMARY"
              echo "$self_hosted"
            else
              echo "Selector '$label' did not match an available self-hosted runner" >&2
              echo "- $label: fallback" >> "$GITHUB_STEP_SUMMARY"
              echo "$fallback"
            fi
          }

          echo "linux_x64=$(pick_runner 'sg-ubuntu-linux' "$SH_LINUX_X64" "$FB_LINUX")"   >> "$GITHUB_OUTPUT"
          echo "linux_arm=$(pick_runner 'sg-arm-linux'    "$SH_LINUX_ARM" "$FB_LINUX_ARM")" >> "$GITHUB_OUTPUT"
          echo "windows=$(pick_runner   'SG-WIN11'        "$SH_WINDOWS"   "$FB_WINDOWS")" >> "$GITHUB_OUTPUT"
          echo "mac=$(pick_runner       'gv-OSX-Large'    "$SH_MAC"       "$FB_MAC")"     >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-runners
    env:
      GRPC_BUILD_ENABLE_CCACHE: "ON"
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
    runs-on: ${{ fromJson(needs.resolve-runners.outputs[matrix.runner_key]) }}
    container:
      image: ${{matrix.container}}
      credentials:
        username: ${{github.actor}}
        password: ${{secrets.GNUS_TOKEN_1}}
    strategy:
      fail-fast: false
      matrix:
        target: [Android, iOS, OSX, Linux, Windows]
        build-type: [Debug,Release]
        abi: [""]
        include:
          - target: Linux
            runner_key: linux_x64
            abi: "x86_64"
            build-type: "Release"
            container: ghcr.io/geniusventures/debian-bullseye:latest
          - target: Linux
            runner_key: linux_x64
            abi: "x86_64"
            build-type: "Debug"
            container: ghcr.io/geniusventures/debian-bullseye:latest
          - target: Linux
            runner_key: linux_arm
            abi: "aarch64"
            build-type: "Release"
            container: ghcr.io/geniusventures/debian-bullseye:latest
          - target: Linux
            runner_key: linux_arm
            abi: "aarch64"
            build-type: "Debug"
            container: ghcr.io/geniusventures/debian-bullseye:latest
          - target: Windows
            runner_key: windows
          - target: OSX
            runner_key: mac
          - target: Android
            runner_key: linux_x64
            abi: arm64-v8a
            build-type: "Release"
          - target: Android
            runner_key: linux_x64
            abi: arm64-v8a
            build-type: "Debug"
          - target: Android
            runner_key: linux_x64
            abi: armeabi-v7a
            build-type: "Release"
          - target: Android
            runner_key: linux_x64
            abi: armeabi-v7a
            build-type: "Debug"
          - target: iOS
            runner_key: mac
        exclude:
          - target: Android
            abi: ""
          - target: Linux
            abi: ""
    steps:
      - name: Clean workspace (self-hosted runners - Unix)
        if: ${{ runner.environment == 'self-hosted' && matrix.target != 'Windows' }}
        working-directory: ${{runner.workspace}}
        run: |
          echo "=== PRE-CLEANUP DEBUG ==="
          echo "Current working directory: $(pwd)"
          echo "Runner workspace: ${RUNNER_WORKSPACE}"
          echo "GitHub workspace: ${{github.workspace}}"

          echo "=== CLEANUP ARTIFACTS ==="
          # Clean up artifacts from previous runs (self-hosted runners only)
          
          # Clean contents of SuperGenius directory but keep the directory itself
          if [ -d "SuperGenius" ]; then
            echo "Cleaning SuperGenius directory contents..."
            rm -rf SuperGenius/* SuperGenius/.* 2>/dev/null || true
            echo "SuperGenius directory cleaned (kept the directory)"
          fi
          
          # Delete sibling dependency directories completely
          if [ -d "thirdparty" ]; then
            echo "Removing thirdparty directory..."
            rm -rf thirdparty
          fi
          if [ -d "zkLLVM" ]; then
            echo "Removing zkLLVM directory..."
            rm -rf zkLLVM
          fi

          echo "=== POST-CLEANUP DEBUG ==="
          echo "Runner workspace contents:"
          ls -la
          if [ -d "SuperGenius" ]; then
            echo "SuperGenius directory exists and contains:"
            ls -la SuperGenius/ 2>/dev/null || echo "  (empty)"
          fi
        shell: bash
        env:
          RUNNER_WORKSPACE: ${{runner.workspace}}

      - name: Clean workspace (self-hosted runners - Windows)
        if: ${{ runner.environment == 'self-hosted' && matrix.target == 'Windows' }}
        working-directory: ${{runner.workspace}}
        run: |
          Write-Output "=== PRE-CLEANUP DEBUG ==="
          Write-Output "Current working directory: $(Get-Location)"
          Write-Output "Runner workspace: ${{runner.workspace}}"
          Write-Output "GitHub workspace: ${{github.workspace}}"

          Write-Output "=== CLEANUP ARTIFACTS ==="
          # Clean up artifacts from previous runs (self-hosted runners only)
          
          # Clean contents of SuperGenius directory but keep the directory itself
          if (Test-Path "SuperGenius") {
            Write-Output "Cleaning SuperGenius directory contents..."
            Get-ChildItem -Path "SuperGenius" -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Write-Output "SuperGenius directory cleaned (kept the directory)"
          }
          
          # Delete sibling dependency directories completely
          if (Test-Path "thirdparty") {
            Write-Output "Removing thirdparty directory..."
            Remove-Item -Path "thirdparty" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "zkLLVM") {
            Write-Output "Removing zkLLVM directory..."
            Remove-Item -Path "zkLLVM" -Recurse -Force -ErrorAction SilentlyContinue
          }

          Write-Output "=== POST-CLEANUP DEBUG ==="
          Write-Output "Runner workspace contents:"
          Get-ChildItem -Force
          if (Test-Path "SuperGenius") {
            Write-Output "SuperGenius directory exists and contains:"
            Get-ChildItem -Path "SuperGenius" -Force -ErrorAction SilentlyContinue | Out-Null
            if ($?) { Get-ChildItem -Path "SuperGenius" -Force } else { Write-Output "  (empty)" }
          }

      - name: Checkout SuperGenius repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: "SuperGenius"
          submodules: "recursive"
          ref: ${{ github.event.inputs.tag }}
          persist-credentials: true # We need the credentials for uploading the release later

      - name: Set build directory
        run: |
          if [ '${{matrix.abi}}' ]; then
            BUILD_DIRECTORY=build/${{matrix.target}}/${{matrix.build-type}}/${{matrix.abi}}
          else
            BUILD_DIRECTORY=build/${{matrix.target}}/${{matrix.build-type}}
          fi
          echo "BUILD_DIRECTORY=$BUILD_DIRECTORY" >> $GITHUB_ENV
        shell: bash

      - name: Download thirdparty release
        working-directory: ${{github.workspace}}
        shell: bash
        env:
          THIRDPARTY_TAG: ${{github.event.inputs.thirdparty_tag || github.event.inputs.tag}}
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG_NAME="${GITHUB_EVENT_INPUTS_TAG}"
          echo "Building for tag: ${TAG_NAME}"
          echo "Using thirdparty tag: ${THIRDPARTY_TAG}"

          if [ '${{matrix.abi}}' ]; then
            FILE_NAME=${{matrix.target}}-${{matrix.abi}}-${{matrix.build-type}}.tar.gz
          else
            FILE_NAME=${{matrix.target}}-${{matrix.build-type}}.tar.gz
          fi
          echo "FILE_NAME=${FILE_NAME}" >> $GITHUB_ENV

          mkdir thirdparty
          cd thirdparty

          # Download from the specified thirdparty tag's release
          echo "Downloading thirdparty from tag: ${THIRDPARTY_TAG}"

          gh release download ${THIRDPARTY_TAG} --repo GeniusVentures/thirdparty -p "${FILE_NAME}"
          tar -zxf "${FILE_NAME}"

          # Set THIRDPARTY_BUILD_DIR to the actual location where files were extracted
          if [ "${{ matrix.target }}" = "Windows" ]; then
            # Convert Unix path to Windows path for Windows builds
            echo "THIRDPARTY_BUILD_DIR=$(pwd -W)/${BUILD_DIRECTORY}" >> $GITHUB_ENV
          else
            echo "THIRDPARTY_BUILD_DIR=$(pwd)/${BUILD_DIRECTORY}" >> $GITHUB_ENV
          fi

      - name: Download zkLLVM release
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          TAG_NAME="${GITHUB_EVENT_INPUTS_TAG}"
          echo "Using zkLLVM tag: ${ZKLLVM_TAG}"
          
          mkdir zkLLVM
          cd zkLLVM

          echo "Downloading zkLLVM from tag: ${ZKLLVM_TAG}"

          if [ "${{ matrix.target }}" = "Windows" ]; then
              ZKLLVM_FILE_NAME=${{matrix.target}}-${{matrix.build-type}}.tar.gz
              ZKLLVM_BUILD_DIR=build/${{matrix.target}}/${{matrix.build-type}}
          elif [ '${{matrix.abi}}' ]; then
              ZKLLVM_FILE_NAME=${{matrix.target}}-${{matrix.abi}}-Release.tar.gz
              ZKLLVM_BUILD_DIR=build/${{matrix.target}}/Release/${{matrix.abi}}
          else
              ZKLLVM_FILE_NAME=${{matrix.target}}-Release.tar.gz
              ZKLLVM_BUILD_DIR=build/${{matrix.target}}/Release
          fi

          gh release download ${ZKLLVM_TAG} --repo GeniusVentures/zkLLVM -p "${ZKLLVM_FILE_NAME}"

          tar --exclude='*bin/assigner' --exclude='*bin/clang-zkllvm' --exclude='*bin/llvm-link-zkllvm' --exclude='*bin/transpiler' -xzf "${ZKLLVM_FILE_NAME}"

          # Set ZKLLVM_BUILD_DIR to the actual location where files were extracted

          if [ "${{ matrix.target }}" = "Windows" ]; then
            # Convert Unix path to Windows path for Windows builds
            echo "ZKLLVM_BUILD_DIR=$(pwd -W)/${ZKLLVM_BUILD_DIR}" >> $GITHUB_ENV
          else
            echo "ZKLLVM_BUILD_DIR=$(pwd)/${ZKLLVM_BUILD_DIR}" >> $GITHUB_ENV
          fi
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}
          ZKLLVM_TAG: ${{ github.event.inputs.zkllvm_tag || github.event.inputs.tag }}

      - name: Configure Linux host
        if: ${{ runner.os == 'Linux'}}
        run: |
          sudo update-alternatives --install /usr/bin/cc cc $(which clang) 100
          sudo update-alternatives --install /usr/bin/c++ c++ $(which clang++) 100
          sudo update-alternatives --set cc $(which clang)
          sudo update-alternatives --set c++ $(which clang++)

          # Refresh apt indices first: GitHub-hosted runners use
          # mirror+file:/etc/apt/apt-mirrors.txt (Azure mirrors) whose cached
          # lists can reference superseded package versions (e.g.
          # libgcrypt20-dev 1.10.3-2ubuntu0.1, a dep of libsecret-1-dev)
          # that 404 on the mirror until the index is refreshed.
          sudo apt-get update
          sudo apt install ccache ninja-build libvulkan-dev libsecret-1-dev -y
          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      - name: Configure Windows host
        if: ${{ runner.os == 'Windows'}}
        run: |
          choco install ccache -A

      - name: Configure macOS host
        if: ${{ runner.os == 'macOS'}}
        run: |
          brew install ninja bash gnu-tar
          
          # Ensure GNU tar is first in PATH - check both possible Homebrew locations
          if [ -d "/opt/homebrew/opt/gnu-tar/libexec/gnubin" ]; then
            echo "PATH=/opt/homebrew/opt/gnu-tar/libexec/gnubin:$PATH" >> $GITHUB_ENV
            echo "Using GNU tar from /opt/homebrew"
          elif [ -d "/usr/local/opt/gnu-tar/libexec/gnubin" ]; then
            echo "PATH=/usr/local/opt/gnu-tar/libexec/gnubin:$PATH" >> $GITHUB_ENV
            echo "Using GNU tar from /usr/local"
          else
            echo "WARNING: GNU tar installation not found in expected locations"
            echo "Available tar: $(which tar)"
          fi
          
          echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      - name: Add Darwin toolchain
        if: ${{ matrix.target == 'OSX'}}
        run: rustup target add x86_64-apple-darwin

      - name: Add iOS toolchain
        if: ${{ matrix.target == 'iOS' }}
        run: |
          rustup toolchain install nightly-aarch64-apple-darwin
          rustup component add rust-src --toolchain nightly-aarch64-apple-darwin
          rustup target add aarch64-apple-ios

      - name: Add Android toolchain
        if: ${{ matrix.target == 'Android' }}
        run: |
          # Setup Android SDK
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          
          # Download command-line tools if not present
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            echo "Downloading Android command-line tools..."
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm cmdline-tools.zip
          else
            echo "Android command-line tools already exist"
          fi
          
          # Always accept licenses and install/update required SDK components
          echo "Installing/updating Android SDK components..."
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          
          # Set environment variables
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          
          # Verify SDK installation
          echo "=== Android SDK Setup ==="
          echo "ANDROID_HOME: $ANDROID_SDK_ROOT"
          echo "SDK contents:"
          ls -la "$ANDROID_SDK_ROOT"

          # Download and setup Android NDK
          NDK_VERSION="r27b"
          NDK_DIR="$HOME/android-ndk-$NDK_VERSION"
          
          if [ ! -d "$NDK_DIR" ]; then
            echo "Downloading Android NDK..."
            wget https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip -O ndk.zip
            unzip -o ndk.zip -d $HOME
            rm ndk.zip
          else
            echo "Android NDK already exists at $NDK_DIR, skipping download"
          fi

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install bindgen
        run: cargo install cbindgen

      - name: Add wasm Rust target
        run: rustup target add wasm32-unknown-emscripten

      - name: Configure CMake for Android
        if: ${{ matrix.target == 'Android'}}
        working-directory: ${{github.workspace}}/SuperGenius
        run: cmake -S build/${{matrix.target}} -B $BUILD_DIRECTORY -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DSGNS_NETWORK=release -DANDROID_ABI=${{matrix.abi}} -DTHIRDPARTY_DIR=${{github.workspace}}/thirdparty -DTHIRDPARTY_BUILD_DIR=${{env.THIRDPARTY_BUILD_DIR}} -DZKLLVM_DIR=${{env.ZKLLVM_BUILD_DIR}} -DZKLLVM_BUILD_DIR=${{env.ZKLLVM_BUILD_DIR}}

      - name: Configure CMake for Mac
        if: ${{ matrix.target == 'OSX'}}
        working-directory: ${{github.workspace}}/SuperGenius
        run: cmake -S build/${{matrix.target}} -B $BUILD_DIRECTORY -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DSGNS_NETWORK=release -DPLATFORM=MAC_UNIVERSAL -DTHIRDPARTY_DIR=${{github.workspace}}/thirdparty -DTHIRDPARTY_BUILD_DIR=${{env.THIRDPARTY_BUILD_DIR}} -DZKLLVM_DIR=${{env.ZKLLVM_BUILD_DIR}} -DZKLLVM_BUILD_DIR=${{env.ZKLLVM_BUILD_DIR}}

      - name: Configure CMake for iOS
        if: ${{ matrix.target == 'iOS'}}
        working-directory: ${{github.workspace}}/SuperGenius
        run: cmake -S build/${{matrix.target}} -B $BUILD_DIRECTORY -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DSGNS_NETWORK=release -DPLATFORM=OS64 -DTHIRDPARTY_DIR=${{github.workspace}}/thirdparty -DTHIRDPARTY_BUILD_DIR=${{env.THIRDPARTY_BUILD_DIR}} -DZKLLVM_DIR=${{env.ZKLLVM_BUILD_DIR}} -DZKLLVM_BUILD_DIR=${{env.ZKLLVM_BUILD_DIR}}

      - name: Configure CMake for Linux
        if: ${{matrix.target == 'Linux'}}
        working-directory: ${{github.workspace}}/SuperGenius
        run: cmake -S build/${{matrix.target}} -B $BUILD_DIRECTORY -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DSGNS_NETWORK=release -DTHIRDPARTY_DIR=${{github.workspace}}/thirdparty -DTHIRDPARTY_BUILD_DIR=${{env.THIRDPARTY_BUILD_DIR}} -DZKLLVM_DIR=${{env.ZKLLVM_BUILD_DIR}} -DZKLLVM_BUILD_DIR=${{env.ZKLLVM_BUILD_DIR}} -DABI_SUBFOLDER_NAME=${{matrix.abi}}

      - name: Configure CMake for Windows
        if: ${{matrix.target == 'Windows'}}
        working-directory: ${{github.workspace}}/SuperGenius
        run: cmake -S build/${{matrix.target}} -B $env:BUILD_DIRECTORY -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DSGNS_NETWORK=release -DTHIRDPARTY_DIR=${{github.workspace}}/thirdparty -DTHIRDPARTY_BUILD_DIR=${{env.THIRDPARTY_BUILD_DIR}}  -DZKLLVM_DIR=${{env.ZKLLVM_BUILD_DIR}} -DZKLLVM_BUILD_DIR=${{env.ZKLLVM_BUILD_DIR}}

      - name: Build SuperGenius
        working-directory: ${{github.workspace}}/SuperGenius/${{env.BUILD_DIRECTORY}}
        run: cmake --build . --config ${{matrix.build-type}} -j

      - name: Install SuperGenius
        working-directory: ${{github.workspace}}/SuperGenius/${{env.BUILD_DIRECTORY}}
        run: cmake --install . --config ${{matrix.build-type}}

      - name: Create or check release
        shell: bash
        working-directory: ${{github.workspace}}/SuperGenius
        run: |
          TAG_NAME="${GITHUB_EVENT_INPUTS_TAG}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          echo "Checking if GitHub release exists for tag: $TAG_NAME"

          set +e
          gh release view $TAG_NAME
          releaseFound=$?
          set -e

          if [[ $releaseFound -ne 0 ]]; then
              echo "Release not found, creating for tag: $TAG_NAME"

              # Create a single release for the tag
              gh release create $TAG_NAME \
                  -n "Build artifacts for tag ${TAG_NAME}" \
                  -t "${TAG_NAME} build artifacts"
          else
              echo "Release already exists for tag: $TAG_NAME"
          fi
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}

      - name: Compress build artifacts
        working-directory: ${{github.workspace}}/SuperGenius/${{env.BUILD_DIRECTORY}}
        run: |
          tar --exclude=.git -czvf ${FILE_NAME} --transform 's|^|${{env.BUILD_DIRECTORY}}/|' SuperGenius/
        shell: bash

      - name: Release file
        working-directory: ${{github.workspace}}/SuperGenius/${{env.BUILD_DIRECTORY}}
        shell: bash
        run: |
          echo -e "Uploading ${FILE_NAME} to release ${TAG_NAME}"
          gh release upload --clobber ${TAG_NAME} ${FILE_NAME}

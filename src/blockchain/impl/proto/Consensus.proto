syntax = "proto3";

package sgns;

import "account/proto/SGTransaction.proto";

// Re-export SGTransaction types for use in oneof fields
// (protobuf requires messages to be imported before use in oneof)

// Deterministic hash of a canonical UTF-8 string.
message HashOfAString {
  bytes hash = 1;
}

// The typed operation or data that validators are asked to agree on.
// A subject is wrapped in a ConsensusProposal, voted on by validators, and,
// after reaching quorum, represented by a ConsensusCertificate.
//
// The consensus layer uses subject_type_hash to dispatch the canonical payload
// to its type-specific validation handler. Examples include transactions, task
// results, and validator-registry batches.
message ConsensusSubject {
  // Public address of the account associated with or originating the subject.
  string account_id = 3;
  // Hash of the canonical subject type string for table/switch dispatch.
  HashOfAString subject_type_hash = 4;
  // Canonical payload bytes owned by the subject type handler.
  bytes payload = 5;
  // Hash of payload bytes.
  bytes payload_hash = 6;
}

message UTXOTransitionCommitment {
  message CommittedOutPoint {
    bytes tx_id_hash = 1;
    uint32 output_index = 2;
  }

  message CommittedOutput {
    bytes tx_id_hash = 1;
    uint32 output_index = 2;
    string owner_address = 3;
    bytes token_id = 4;
    uint64 amount = 5;
  }

  repeated CommittedOutPoint consumed_outpoints = 1;
  repeated CommittedOutput produced_outputs = 2;
  bytes consumed_outpoints_root = 3;
  bytes produced_outputs_root = 4;
}

message MerkleProofStep {
  bytes sibling_hash = 1;
  bool is_left_sibling = 2;
}

message ConsumedInputProof {
  bytes tx_id_hash = 1;
  uint32 output_index = 2;
  bytes leaf_payload = 3;
  repeated MerkleProofStep branch = 4;
  repeated MerkleProofStep produced_branch = 5;
}

message UTXOWitness {
  repeated ConsumedInputProof consumed_inputs = 1;
}

message NonceSubject {
  uint64 nonce = 1;
  bytes tx_hash = 2;
  UTXOTransitionCommitment utxo_commitment = 3;
  UTXOWitness utxo_witness = 4;
  EmbeddedTransaction transaction = 5;
}

message EmbeddedTransaction {
  oneof transaction {
    SGTransaction.TransferTx transfer = 1;
    SGTransaction.MintTxV2 mint_v2 = 2;
    SGTransaction.MintTx mint = 3;
    SGTransaction.ProcessingTx processing = 4;
    SGTransaction.MigrationTx migration = 5;
    SGTransaction.EscrowTx escrow = 6;
    SGTransaction.EscrowReleaseTx escrow_release = 7;
  }
}

message TaskResultSubject {
  string escrow_path = 1;
  bytes task_result_hash = 2;
  uint64 result_epoch = 3;
}

message RegistryBatchSubject {
  string base_registry_cid = 1;
  uint64 base_registry_epoch = 2;
  uint64 target_registry_epoch = 3;
  uint32 certificate_count = 4;
  bytes batch_root = 5;
}

message ConsensusProposal {
  string proposal_id = 1;
  string proposer_id = 2;
  uint64 timestamp = 3;
  string registry_cid = 4;
  uint64 registry_epoch = 5;
  ConsensusSubject subject = 6;
  bytes signature = 7;
}

/**
 * Phase 6 slot-based RPC-hash voting model (D-01).
 *
 * Slot semantics:
 * - slot_0_hash: SHA-256 of a DIRECT_API endpoint URL (endpoints with
 *   consensus_weight >= 50, per D-02). Weighted 50/100 in the tally.
 * - slot_1_hash: SHA-256 of a PUBLIC endpoint URL (consensus_weight < 50).
 * - slot_2_hash: SHA-256 of a second PUBLIC endpoint URL.
 *
 * Slots 1-2 are subject to >=2-distinct-validator deduplication in the
 * tally (D-03). An EMPTY slot hash (proto3 bytes default) is the abstain /
 * not-populated sentinel (D-05) -- the tally treats slot_N_hash().empty() as
 * "did not vote this slot". The hash lives ONLY in the vote (D-04): no slot
 * hash field is added to ValidatorEntry or ValidatorRegistry.
 *
 * These fields are part of the signing surface: ConsensusAuth::VoteSigningBytes
 * clears only `signature`, so any mutation of a slot hash invalidates the
 * signature (T-06-01 mitigation). Fields 6/7/8 are new tags; old peers
 * silently ignore them (forward/backward wire compatible).
 */
message ConsensusVote {
  string proposal_id = 1;
  string voter_id = 2;
  bool approve = 3;
  uint64 timestamp = 4;
  bytes signature = 5;
  // DIRECT_API endpoint hash (weight >= 50). Empty = abstain (D-05).
  bytes slot_0_hash = 6;
  // PUBLIC endpoint hash (weight < 50). Empty = abstain (D-05).
  bytes slot_1_hash = 7;
  // PUBLIC endpoint hash (weight < 50). Empty = abstain (D-05).
  bytes slot_2_hash = 8;
}

message ConsensusVoteBundle {
  string proposal_id = 1;
  string aggregator_id = 2;
  uint64 timestamp = 3;
  repeated ConsensusVote votes = 4;
  bytes signature = 5;
}

message ConsensusCertificate {
  string proposal_id = 1;
  string registry_cid = 2;
  uint64 registry_epoch = 3;
  uint64 total_weight = 4;
  uint64 approved_weight = 5;
  uint64 timestamp = 6;
  repeated ConsensusVote votes = 7;
  ConsensusProposal proposal = 8;
}

message ConsensusMessage {
  oneof payload {
    ConsensusProposal proposal = 1;
    ConsensusVote vote = 2;
    ConsensusVoteBundle vote_bundle = 3;
    ConsensusCertificate certificate = 4;
  }
}

syntax = "proto3";

package sgns.validator;

message ValidatorEntry {
  string validator_id = 1;
  uint64 weight = 2;
  Role role = 3;
  Status status = 4;
  uint32 penalty_score = 5;
  uint32 missed_epochs = 6;
}

message Registry {
  uint64 epoch = 1;
  repeated ValidatorEntry validators = 2;
}

enum Role {
  GENESIS = 0;
  FULL = 1;
  REGULAR = 2;
  SHARDED = 3;
}

enum Status {
  ACTIVE = 0;
  SUSPENDED = 1;
  BLACKLISTED = 2;
}

message SignatureEntry {
  string validator_id = 1;
  bytes signature = 2;
}

message RegistryUpdate {
  Registry registry = 1;
  string prev_registry_hash = 2;
  repeated SignatureEntry signatures = 3;
  bytes certificate = 4;
  // Informational metadata only - nothing reads it for verification.
  repeated string batch_certificate_subject_hashes = 5;
  // Authoritative batch members as canonical certificate slots.
  repeated string batch_certificate_slots = 6;
}

message RegistrySigningPayload {
  Registry registry = 1;
  string prev_registry_hash = 2;
}

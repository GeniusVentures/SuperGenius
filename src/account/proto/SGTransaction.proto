syntax = "proto3";

package SGTransaction;

message DAGStruct 
{
    string type = 1;// 
    bytes previous_hash = 2; // 
    bytes source_addr = 3; // 
    uint64 nonce = 4; // 
    int64 timestamp = 5; // 
    bytes uncle_hash = 6; // 
    bytes data_hash = 7; // 
    bytes signature = 8;    
}

message DAGWrapper 
{
    DAGStruct dag_struct = 1;// 
}

message TransferUTXOInput
{
    bytes tx_id_hash = 1; // 
    uint32 output_index = 2; //
    bytes signature = 3; //
}
message TransferOutput
{
    uint64 encrypted_amount = 1; // 
    bytes dest_addr = 2; // 
    bytes token_id = 3; //
}
message UTXOTxParams
{
    repeated TransferUTXOInput inputs = 1; // 
    repeated TransferOutput outputs = 2; // 
}
message UTXO
{
    uint32 output_idx = 1;
    uint64 amount = 2;
    bytes hash = 3;
    bytes token = 4;
}

enum UTXOEntryState
{
    UTXO_ENTRY_READY = 0;
    UTXO_ENTRY_CONSUMED = 1;
    UTXO_ENTRY_RESERVED = 2;
}

message UTXOEntryRecord
{
    UTXO utxo = 1;
    string owner_address = 2;
    UTXOEntryState state = 3;
    uint64 created_epoch = 4;
    bool has_spent_epoch = 5;
    uint64 spent_epoch = 6;
    bool has_spent_by_txid = 7;
    bytes spent_by_txid = 8;
}

message UTXOCheckpointRecord
{
    string owner_address = 1;
    uint64 epoch = 2;
    bytes last_finalized_tx = 3;
    bytes registry_hash = 4;
    bytes utxo_merkle_root = 5;
    uint64 utxo_count = 6;
    uint64 created_at_ms = 7;
}

message UTXOList
{
    repeated UTXO utxos = 1;
}
message TransferTx
{
    DAGStruct dag_struct = 1;// 
    bytes token_id = 2; // 
    UTXOTxParams utxo_params = 3; //

}
message ProcessingTx
{
    DAGStruct dag_struct = 1;// 
    uint64 mpc_magic_key = 2; //
    uint64 offset = 3; //
    string job_cid = 4; // 
    repeated string subtask_cids = 5; // 
    repeated string node_addresses = 6;
}
message MintTx
{
    DAGStruct dag_struct = 1;// 
    bytes chain_id = 2;
    bytes token_id = 3;
    uint64 amount = 4; // 
}
message MintTxV2
{
    DAGStruct dag_struct = 1;//
    bytes chain_id = 2;
    bytes token_id = 3;
    uint64 amount = 4; //
    UTXOTxParams utxo_params = 5;
}
message MigrationTx
{
    DAGStruct dag_struct = 1;//
    bytes token_id = 2;
    uint64 amount = 3; //
    UTXOTxParams utxo_params = 4;
    string from_version = 5;
}
message EscrowTx
{
    DAGStruct dag_struct = 1;// 
    UTXOTxParams utxo_params = 2; //
    uint64 amount = 3;
    bytes dev_addr = 4; // 
    uint64 peers_cut = 5; // 
}
message EscrowReleaseTx 
{
  SGTransaction.DAGStruct dag_struct = 1;
  UTXOTxParams utxo_params = 2;
  uint64 release_amount = 3;
  string release_address = 4;
  string escrow_source = 5; 
  string original_escrow_hash = 6; 
}

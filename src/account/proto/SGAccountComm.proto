syntax = "proto3";

package accountComm;

message AccountMessage {
  oneof payload {
    SignedNonceRequest nonce_request = 1;
    SignedNonceResponse nonce_response = 2;
    SignedBlockRequest block_request = 3;    // changed: generic block request with index
    SignedBlockResponse block_response = 4;
    SignedHeadRequest head_request = 5;
  }
}

message SignedNonceRequest {
  NonceRequest data = 1;
  bytes signature = 2;
}

message SignedNonceResponse {
  NonceResponse data = 1;
  bytes signature = 2;
}

message NonceRequest {
  string requester_address = 1;
  uint64 request_id = 2;
  uint64 timestamp = 3;
}

message NonceResponse {
  string responder_address = 1;
  string requester_address = 2;
  uint64 request_id = 3;
  uint64 known_nonce = 4;
  uint64 timestamp = 5;
  bool has_nonce = 6;          // true if known_nonce is valid, false if no nonce available
}

// New generic block request (index: 0 = genesis, 1 = account, ...)
message BlockRequest {
  string requester_address = 1;
  uint64 request_id = 2;
  uint64 timestamp = 3;
  uint32 block_index = 4;
}

message SignedBlockRequest {
  BlockRequest data = 1;
  bytes signature = 2;
}


message BlockInfo {
  bytes cid = 1;
  bytes peer_id = 2;
  repeated bytes addresses = 3;
}

message BlockResponse {
  string responder_address = 1;
  string requester_address = 2;
  uint64 request_id = 3;
  repeated BlockInfo blocks = 4;
  uint64 timestamp = 5;
}

message SignedBlockResponse {
  BlockResponse data = 1;
  bytes signature = 2;
}

// Head request for CRDT heads on specific topics
// Response is handled by broadcasting directly on the requested topics via the CRDT broadcaster
message HeadRequest {
  string requester_address = 1;
  uint64 request_id = 2;
  uint64 timestamp = 3;
  repeated string topics = 4;  // topics to request heads for
}

message SignedHeadRequest {
  HeadRequest data = 1;
  bytes signature = 2;
}